 / MOV R3,R4,ASR #1 - comment each line with its running value."]}, {"part": "(b)(i)", "marks": 10, "command_word": "Determine", "command_meaning": "Bloom 'Apply/Analyse'. You must work out exact numerical answers - here the byte-address ranges (start and end, in hex) that the ARM processor sees for the ROM bank and for the SRAM bank - and show the arithmetic that gets you there. 'Determine' is not 'state': the marks are in the capacity calculation (four parallel byte-wide chips -> 32-bit word -> total bytes) and in placing the two banks contiguously from the bottom of memory.", "steps": [{"do": "Work out the total capacity of ONE bank. The four chips are byte-wide (each drives 8 of the 32 data lines D[31:24]/D[23:16]/D[15:8]/D[7:0]) and sit in PARALLEL, so one address reads all four at once = one 32-bit word = 4 bytes. Total bytes = number of chips x per-chip size. This mirrors the course's capacity method (locations x width / 8 = bytes).", "write": "ROM bank = 4 chips x 1 MB each = 4 MB = 4 x 2^20 = 2^22 bytes = 0x00400000 bytes.\nSRAM bank = 4 chips x 1 MB each = 4 MB = 2^22 bytes = 0x00400000 bytes.", "slide": "slide 26 (byte-capacity method: words x bits/word / 8 = bytes) and slide 115 (ARM memory system: byte/nibble, Figure 32 ARM Memory Organization)"}, {"do": "Place the ROM. It is mapped 'from the bottom of memory', i.e. starting at ARM byte address 0x00000000. The end address = start + size - 1. This also matches the ARM reset/vector table living at the very bottom (0x00-0x1C), which must be in ROM.", "write": "ROM start = 0x00000000.\nROM end  = 0x00000000 + 0x00400000 - 1 = 0x003FFFFF.\nROM range = 0x00000000 to 0x003FFFFF (4 MB).", "slide": "slide 119 (ARM Exceptions: PC forced to vector addresses 0x00-0x1C at the bottom of memory - so the bottom bank is non-volatile ROM) and slide 118 (addresses are locations in the ARM memory map)"}, {"do": "Place the SRAM 'immediately above the ROM space, continuously'. So SRAM start = the first byte after the ROM top = ROM end + 1. Add the SRAM size to get its end.", "write": "SRAM start = 0x003FFFFF + 1 = 0x00400000.\nSRAM end  = 0x00400000 + 0x00400000 - 1 = 0x007FFFFF.\nSRAM range = 0x00400000 to 0x007FFFFF (4 MB).", "slide": "slide 115 (ARM Memory Organization - contiguous byte-addressed space) and slide 116 (load-store: memory is a linear space accessed by LDR/STR)"}, {"do": "Sanity-check the sizes. Each range must span exactly 0x00400000 bytes (4 MB). Confirm the two banks are contiguous and do not overlap, and note how small this is versus the ARM's full 4 GB (0x00000000-0xFFFFFFFF, 2^32 byte) address space.", "write": "ROM span = 0x003FFFFF - 0x00000000 + 1 = 0x00400000 = 4 MB. OK.\nSRAM span = 0x007FFFFF - 0x00400000 + 1 = 0x00400000 = 4 MB. OK.\nTogether they occupy 0x00000000-0x007FFFFF (8 MB) of the 4 GB ARM map; everything above 0x00800000 is unused/available.", "slide": "slide 115 (ARM memory system) and slide 118 (the memory map; devices appear as addressable locations within it)"}], "model_answer": "Step 1 - capacity of each bank.\nFour byte-wide chips in parallel each supply one byte of the 32-bit data bus (D[31:24], D[23:16], D[15:8], D[7:0]). One address therefore accesses all four chips simultaneously = one 32-bit word = 4 bytes. The total byte capacity of a bank = (number of parallel chips) x (per-chip capacity):\n  ROM  = 4 x 1 MB = 4 MB = 4 x 2^20 bytes = 2^22 bytes = 0x00400000 bytes\n  SRAM = 4 x 1 MB = 4 MB = 2^22 bytes          = 0x00400000 bytes\n(1 MB = 2^20 = 1,048,576 bytes, so 4 MB = 4,194,304 bytes = 0x400000.)\n\nStep 2 - ROM address range (mapped from the bottom of memory).\n  Start = 0x00000000\n  End   = start + size - 1 = 0x00000000 + 0x00400000 - 1 = 0x003FFFFF\n  => ROM occupies 0x00000000 - 0x003FFFFF  (4 MB)\nThis is consistent with the ARM reset and exception vectors, which are forced to addresses 0x00000000-0x0000001C and so must live in non-volatile ROM at the bottom of memory.\n\nStep 3 - SRAM address range (immediately above ROM, contiguous).\n  Start = ROM end + 1 = 0x003FFFFF + 1 = 0x00400000\n  End   = start + size - 1 = 0x00400000 + 0x00400000 - 1 = 0x007FFFFF\n  => SRAM occupies 0x00400000 - 0x007FFFFF  (4 MB)\n\nStep 4 - check.\n  ROM span  = 0x003FFFFF - 0x00000000 + 1 = 0x00400000 = 4 MB  (correct)\n  SRAM span = 0x007FFFFF - 0x00400000 + 1 = 0x00400000 = 4 MB  (correct)\n  Contiguous, no overlap; together 0x00000000-0x007FFFFF = 8 MB of the ARM's full 2^32-byte (4 GB) address space.\n\nANSWER:\n  ROM : 0x00000000 to 0x003FFFFF  (4 MB)\n  SRAM: 0x00400000 to 0x007FFFFF  (4 MB)", "rubric": "10 marks:\n- 3 marks: correct total capacity reasoning - recognises that 4 byte-wide chips in parallel form a 32-bit word and that total bytes = 4 x per-chip (2 marks), giving 4 MB per bank = 0x00400000 bytes (1 mark). Awarding just 1 MB per bank (forgetting the x4 parallel chips) loses all 3.\n- 3 marks: ROM range correct - starts at 0x00000000 (1), correct end 0x003FFFFF using size-1 (2). An off-by-one end (e.g. 0x00400000) loses 1.\n- 3 marks: SRAM range correct - starts contiguously at 0x00400000 (2), correct end 0x007FFFFF (1).\n- 1 mark: units/working shown (hex, size-1 arithmetic, or a validity check). \nMethod marks carry: if a candidate uses a wrong per-chip size but applies 'x4 parallel, stack from 0, end=start+size-1' correctly, award the method marks.", "hints": ["First decide how many bytes ONE bank holds. The four chips are byte-wide and in PARALLEL on the 32-bit bus - does that make the bank wider or deeper, and what is the total byte count?", "Four chips each contributing 8 bits means every address gives you 32 bits = 4 bytes at once. Total bytes in the bank = 4 chips x 1 MB = 4 MB. Convert 4 MB to hex before you place it.", "4 MB = 4 x 2^20 = 2^22 bytes = 0x00400000 bytes. ROM starts at the very bottom, address 0x00000000.", "End address = start + size - 1 (not start + size). So ROM ends at 0x00000000 + 0x400000 - 1 = 0x003FFFFF. SRAM starts one byte higher.", "ROM = 0x00000000 to 0x003FFFFF (4 MB). SRAM sits immediately above: start 0x00400000, end 0x00400000 + 0x400000 - 1 = 0x007FFFFF. So SRAM = 0x00400000 to 0x007FFFFF (4 MB)."]}, {"part": "(b)(ii)", "marks": 5, "command_word": "Sketch", "command_meaning": "Bloom 'Apply'. Draw a labelled memory map: a vertical bar representing the ARM byte-address space with address growing upward (or downward, stated), showing the ROM block at the bottom and the SRAM block stacked directly on top of it, each annotated with its start address, end address, and size. The marks are for correct ordering (ROM at the bottom), the contiguous boundary at 0x00400000, and the hex labels matching part (i).", "steps": [{"do": "Draw the address axis and fix the convention: a tall rectangle for memory with the lowest address (0x00000000) at the bottom and addresses increasing upward. State the convention so the grader reads it correctly.", "write": "Label the bottom edge 0x00000000 and mark the direction 'address increases upward'.", "slide": "slide 115 (Figure 32. ARM Memory Organization - the course's own memory-map drawing)"}, {"do": "Draw the ROM block occupying the bottom 4 MB, annotated with its range and size, and note it holds the reset/exception vectors.", "write": "Bottom block = ROM, 0x00000000 - 0x003FFFFF, 4 MB (contains reset + exception vectors at 0x00-0x1C).", "slide": "slide 119 (vector table at the bottom of memory, 0x00-0x1C) and slide 115"}, {"do": "Draw the SRAM block directly above, sharing the boundary at 0x00400000, annotated with its range and size. Mark the shared boundary line clearly so it is visibly contiguous.", "write": "Next block up = SRAM, 0x00400000 - 0x007FFFFF, 4 MB; boundary line at 0x00400000.", "slide": "slide 115 (contiguous ARM memory organization) and slide 116 (linear load-store memory)"}, {"do": "Show the rest of the 4 GB space above as unused/available up to 0xFFFFFFFF, so the sketch is in proportion and the reader sees these banks are a small region at the bottom.", "write": "Top region = unused / available, 0x00800000 - 0xFFFFFFFF; top of map labelled 0xFFFFFFFF (top of ARM 4 GB space).", "slide": "slide 118 (the full ARM memory map; peripherals/other devices also live as addressable locations) and slide 115"}], "model_answer": "ARM byte-address memory map (address increases upward; not to scale):\n\n   0xFFFFFFFF  +---------------------------+  <- top of ARM address space (4 GB)\n              |                           |\n              |      unused / available   |\n              |   (room for I/O, more     |\n              |    memory, peripherals)   |\n              |                           |\n   0x00800000 +---------------------------+  <- first byte above SRAM\n              |                           |\n              |        SRAM  (4 MB)       |\n              |   4 x 1 MB byte-wide,     |\n              |   D[31:24..7:0] parallel  |\n              |   variables / stack / data|\n   0x00400000 +---------------------------+  <- contiguous boundary (ROM top + 1)\n              |                           |\n              |        ROM   (4 MB)       |\n              |   4 x 1 MB byte-wide,     |\n              |   D[31:24..7:0] parallel  |\n              |   code / constants;       |\n              |   reset+vectors 0x00-0x1C |\n   0x00000000 +---------------------------+  <- bottom of memory (reset vector)\n\nKey labels (must match part (i)):\n  ROM  : 0x00000000 - 0x003FFFFF   (4 MB)\n  SRAM : 0x00400000 - 0x007FFFFF   (4 MB)\n  Boundary between them: 0x00400000 (SRAM starts exactly where ROM ends + 1 - contiguous).\n\nEach bank is one 32-bit-wide memory built from four byte-wide chips in parallel driving D[31:24], D[23:16], D[15:8], D[7:0]; a single address reads/writes all four bytes at once.", "rubric": "5 marks:\n- 2 marks: ROM drawn at the bottom starting at 0x00000000 and labelled with range 0x00000000-0x003FFFFF and size 4 MB.\n- 2 marks: SRAM drawn directly above ROM, contiguous at the 0x00400000 boundary, labelled 0x00400000-0x007FFFFF and 4 MB.\n- 1 mark: clear axis/convention (which way addresses grow) and the boundary address shown; bonus-worthy (not required) to show the remaining space up to 0xFFFFFFFF.\n- Penalty: ROM and SRAM swapped (ROM not at bottom) loses 2; a gap or overlap between the banks loses the contiguity mark.", "hints": ["A memory map is just a vertical bar of the address space. Decide which way addresses grow and label the bottom 0x00000000.", "The question says ROM is mapped from the bottom - so ROM is the lowest block, touching address 0.", "SRAM is 'immediately above' and 'continuously', so there is no gap: its bottom edge is the ROM's top edge + 1.", "Put the numbers from part (i) on the block edges: ROM 0x00000000-0x003FFFFF, the shared boundary at 0x00400000, SRAM 0x00400000-0x007FFFFF, each marked 4 MB.", "Draw two stacked boxes: lower box ROM (0x00000000 to 0x003FFFFF, 4 MB, holds reset vectors), upper box SRAM (0x00400000 to 0x007FFFFF, 4 MB), a single boundary line labelled 0x00400000 between them, and optionally 'unused up to 0xFFFFFFFF' above."]}]}], "questionText": {"Q1": "(a) 64 KB SRAM, 32-bit words; data 0x1234DC68 is in word 138 (decimal).\n  (i)[4] Compute the byte address (hex) of word 138.\n  (ii)[4] Appraise the range of byte addresses for word 138.\n  (iii)[4] Big-endian: show how 0x1234DC68 is held (byte addresses + data).\n  (iv)[4] Little-endian: sketch the same.\n  (v)[2] Total capacity in memory WORDS.\n(b) LDR R5,=0x12345678 ; MOV R3,#0x2000 ; STR R5,[R3] ; LDRB R1,[R3,#2].\n  (i)[3] Addressing modes of the last 3 instructions.\n  (ii)[2] R1 if little-endian.  (iii)[2] R1 if big-endian.", "Q2": "(a) ARM7 operating modes.\n  (i)[7] Purpose and importance of ARM operating modes.\n  (ii)[8] What are exceptions and why important; exception priorities; demonstrate entry and exit.\n  (iii)[3] Sketch a diagram and explain how to identify the current mode.\n(b) CPI: Data-Processing=1, Branch=2, Memory=3. Code#1 {DP:2,Branch:1,Mem:2}; Code#2 {DP:4,Branch:1,Mem:1}.\n  (i)[3] Number of instructions in each.\n  (ii)[4] Which executes faster (total cycles)?", "Q3": "(a)(i)[5] Explain pipeline architecture; appraise advantages and disadvantages. (ii)[2] Name one 3-stage and one 5-stage ARM processor.\n(b) SUBS R0,R1,R2 ; BGE SKIP ; ADD R3,R2,R1 ; AND R4,R5,R6 ; SKIP: SUB R7,R6,R5 …\n  (i)[5] Fill the 5-stage chart (IF ID EX MA WB).\n  (ii)[3] In which clock cycle is the BGE outcome known? Explain the pipeline effect.\n  (iii)[10] Which instruction runs after BGE? Identify hazards, causes, and solutions.", "Q4": "(a)[10] Design ARM assembly for W = (4X + 8Y − 6Z + 64) / 2, with R0=X, R1=Y, R2=Z, R3=W; comment each line.\n(b) Figure Q4(b): four byte-wide SRAM + four byte-wide ROM form a 32-bit bus; each SRAM = 1 MB, each ROM = 1 MB; ROM from the bottom of memory, SRAM immediately above.\n  (i)[10] Determine the ARM address range for ROM and for SRAM.\n  (ii)[5] Sketch the memory map."}}], "slideTitles": {"1": "ENG301\u000bMicroprocessor Programming", "2": "Schedule and other details", "3": "Anonymous Q&A", "4": "Learning outcomes", "5": "Study Unit 1", "6": "Study Unit 1", "7": "Topics", "8": "Topic 1", "9": "What is a Processor?", "10": "First computer : ENIAC (December 1945)", "11": "Stored Program Digital Computer", "12": "First implemented SSEM - Manchester “Baby”", "13": "State in a stored program digital computer", "14": "Because the instructions and data share one memory, a design choice ap", "15": "Architecture vs Organization", "16": "Topic 2", "17": "Abstraction", "18": "Transistors", "19": "Logic Gates", "20": "Logic symbol and Truth table Abstraction", "21": "Abstraction in Hardware Design", "22": "Abstraction in modern systems", "23": "Topic 3", "24": "MU0 Design Aspects", "25": "MU0 Components", "26": "Word size – the natural chunk of data the CPU works on in one go", "27": "MU0 Instruction Set", "28": "MU0 Logic Design\u000bGiven the Instruction set (i.e., the kind of tasks I’", "29": "T <script>
(function(){
  "use strict";
  var DATA;
  try{ DATA = JSON.parse(document.getElementById('exam-data').textContent); }
  catch(e){ document.getElementById('content').textContent = 'Could not load the solutions data.'; return; }
  var esc = function(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var titles = DATA.slideTitles||{};
  var PAPERS = DATA.papers||[];
  var activePaper = 0, activeQ = 0;

  document.getElementById('foot').textContent = 'Model solutions verified for correctness and cross-referenced to ' + (DATA.meta&&DATA.meta.deck||'the RECAP deck') + '.';

  // theme toggle (per-viewer convenience)
  var root=document.documentElement, tb=document.getElementById('themeBtn');
  try{ var saved=localStorage.getItem('eng301coach-theme'); if(saved) root.setAttribute('data-theme',saved); }catch(e){}
  tb.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    var dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    var next = dark?'light':'dark'; root.setAttribute('data-theme',next);
    try{ localStorage.setItem('eng301coach-theme',next); }catch(e){}
  });

  function paper(){ return PAPERS[activePaper]||{questions:[],questionText:{}}; }

  function slideChips(str){
    // only pull numbers that follow the word "slide"/"slides" (incl. ranges like 277/278, 190-191),
    // so addresses/capacities/part-numbers inside the annotation don't become fake chips.
    str=String(str||'');
    var nums=[], re=/slides?\s+(\d+(?:\s*(?:[,\-\/;&]|and)\s*\d+)*)/gi, m;
    while((m=re.exec(str))){
      (m[1].match(/\d+/g)||[]).forEach(function(n){ if(nums.indexOf(n)<0) nums.push(n); });
    }
    // fallback: a field that is only digits + separators (no annotation text) — treat all as slide nums
    if(!nums.length && /^[\d\s,\-\/;&]+$/.test(str.trim())) nums=(str.match(/\d+/g)||[]);
    if(!nums.length) return '';
    var html='<div class="chips">';
    nums.forEach(function(n){
      var t=titles[n]||''; var full='slide '+n+(t?(' — '+t):'');
      var shown=t? (t.length>30? t.slice(0,29)+'…':t):'';
      html+='<span class="chip" title="'+esc(full)+'">📑 <b>'+esc(n)+'</b>'+(shown?(' · '+esc(shown)):'')+'</span>';
    });
    return html+'</div>';
  }

  function partCard(p){
    var el=document.createElement('section'); el.className='part';
    var bloom = p.command_word? '<span class="badge bloom" title="Bloom command word">'+esc(p.command_word)+'</span>':'';
    var meaning = p.command_meaning? '<p class="cmd"><b>What '+esc(p.command_word||'this')+' wants:</b> '+esc(p.command_meaning)+'</p>':'';
    var steps=(p.steps||[]).map(function(s,i){
      return '<div class="step"><div class="do"><span class="n">'+(i+1)+'.</span><span>'+esc(s.do)+'</span></div>'+
        (s.write?'<pre class="code">'+esc(s.write)+'</pre>':'')+ slideChips(s.slide)+'</div>';
    }).join('');
    var hints=(p.hints||[]);
    el.innerHTML =
      '<div class="ph"><span class="pid">'+esc(p.part)+'</span>'+
        '<span class="badge marks">'+esc(p.marks)+' marks</span>'+ bloom +'</div>'+
      meaning +
      '<p class="try">Try it yourself first — then reveal in order.</p>'+
      '<div class="controls">'+
        (hints.length?'<button class="rbtn hint" data-act="hint" aria-expanded="false">💡 Hint</button>':'')+
        '<button class="rbtn" data-act="steps" aria-expanded="false">🪜 Step-by-step</button>'+
        '<button class="rbtn" data-act="answer" aria-expanded="false">✅ Model answer</button>'+
      '</div>'+
      '<div class="panel" data-panel="hint" hidden><div class="hintlist"></div></div>'+
      '<div class="panel" data-panel="steps" hidden>'+steps+'</div>'+
      '<div class="panel answer" data-panel="answer" hidden><pre class="code">'+esc(p.model_answer)+'</pre></div>';

    var hintState={shown:0};
    el.querySelectorAll('.rbtn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var act=btn.getAttribute('data-act');
        if(act==='hint'){
          var box=el.querySelector('[data-panel="hint"]'), list=box.querySelector('.hintlist');
          box.hidden=false; btn.setAttribute('aria-expanded','true');
          if(hintState.shown<hints.length){
            var d=document.createElement('div'); d.className='hint-item';
            d.innerHTML='<span class="hn">HINT '+(hintState.shown+1)+' of '+hints.length+'</span>'+esc(hints[hintState.shown]);
            list.appendChild(d); hintState.shown++;
          }
          btn.textContent = hintState.shown>=hints.length ? '💡 All hints shown' : ('💡 Hint ('+(hintState.shown+1)+' of '+hints.length+')');
          if(hintState.shown>=hints.length) btn.disabled=true;
          return;
        }
        var panel=el.querySelector('[data-panel="'+act+'"]');
        var open=panel.hidden; panel.hidden=!open; btn.setAttribute('aria-expanded', open?'true':'false');
      });
    });
    return el;
  }

  function renderQuestion(qi){
    activeQ=qi;
    var P=paper(), q=P.questions[qi], c=document.getElementById('content');
    c.innerHTML='';
    if(!q){ c.textContent='No question.'; return; }
    var head=document.createElement('div'); head.className='qhead';
    head.innerHTML='<h2>'+esc(q.question_id)+(q.overview?' — <span style="font-weight:600">'+esc(q.overview)+'</span>':'')+'</h2>';
    c.appendChild(head);
    var stem=(P.questionText||{})[q.question_id];
    if(stem){ var s=document.createElement('div'); s.className='qstem'; s.textContent=stem; c.appendChild(s); }
    (q.parts||[]).forEach(function(p){ c.appendChild(partCard(p)); });
    window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
  }

  function renderTabs(active){
    activeQ=active;
    var P=paper(), nav=document.getElementById('qtabs'); nav.innerHTML='';
    (P.questions||[]).forEach(function(q,i){
      var total=(q.parts||[]).reduce(function(a,p){return a+(p.marks||0);},0);
      var b=document.createElement('button'); b.className='qtab'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', i===active?'true':'false');
      b.innerHTML=esc(q.question_id)+' <span class="mk">'+total+'m</span>';
      b.addEventListener('click',function(){ renderTabs(i); renderQuestion(i); });
      nav.appendChild(b);
    });
  }

  function renderPaperSel(){
    var box=document.getElementById('papersel'); box.innerHTML='';
    var lab=document.createElement('span'); lab.className='pslabel'; lab.textContent='Paper'; box.appendChild(lab);
    PAPERS.forEach(function(P,i){
      var b=document.createElement('button'); b.className='psbtn'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', i===activePaper?'true':'false');
      b.textContent=P.label||P.id||('Paper '+(i+1));
      b.addEventListener('click',function(){
        activePaper=i; renderPaperSel(); setSub();
        renderTabs(0); renderQuestion(0);
      });
      box.appendChild(b);
    });
  }

  function setSub(){
    document.getElementById('subhead').textContent = (paper().label||'') + ' · how to write the answers';
  }

  renderPaperSel(); setSub(); renderTabs(0); renderQuestion(0);
})();
</script>

</body>
