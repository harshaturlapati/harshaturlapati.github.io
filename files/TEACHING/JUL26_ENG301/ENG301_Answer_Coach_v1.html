wer).", "slide": "slide 184"}], "model_answer": "Little-endian rule (slide 184): the least-significant byte goes at the lowest byte address - exactly as the LDR example on slide 184 stores 0x78 (the least-significant byte of its word) at the lowest address 0x0C.\n\n0x1234DC68  splits as   12 | 34 | DC | 68   (MSB ... LSB)\n\n  Byte addr :  0x228    0x229    0x22A    0x22B\n  (decimal) :  (552)    (553)    (554)    (555)\n  Contents  :   0x68     0xDC     0x34     0x12\n                 ^LSB                       ^MSB\n  (lowest address holds the LEAST-significant byte)\n\nSo in little-endian, word 138 reads 68 DC 34 12 from low address to high - the exact reverse of the big-endian layout in (iii).", "rubric": "1 mark: correct little-endian rule (LSB at lowest address). 1 mark: LSB=0x68 identified. 1 mark: 0x228=0x68 and 0x22B=0x12 (ends correct). 1 mark: clear labelled sketch of all four address/byte pairs. Must be the mirror image of (iii); if identical to (iii) the student has confused the two conventions.", "hints": ["Little-endian puts which byte at the lowest address?", "Look at slide 184: it stores the LEAST-significant byte first (lowest address).", "So 0x68 goes at 0x228 and 0x12 goes at 0x22B.", "It is the exact reverse of your big-endian sketch: 68, DC, 34, 12 from 0x228 up."]}, {"part": "(a)(v)", "marks": 2, "command_word": "Analyse and obtain", "command_meaning": "Break the capacity figure down into its parts and compute the result - total capacity expressed in WORDS.", "steps": [{"do": "State the total byte capacity.", "write": "64 KB = 64 x 1024 = 65536 bytes.", "slide": "slide 26 (capacity-in-bytes reasoning: total bits / 8 = bytes; here capacity given directly in KB)"}, {"do": "Divide by the bytes per word (4).", "write": "Words = 65536 / 4 = 16384.", "slide": "slide 115 (word = 4 bytes)"}, {"do": "Express compactly as a power of two.", "write": "16384 = 16 K words = 2^14 words.", "slide": "slide 26 (powers of two for memory sizing, e.g. 2^12 = 4096)"}], "model_answer": "Total capacity in bytes: 64 KB = 64 x 1024 = 65536 bytes.\nEach word is 32 bits = 4 bytes (slide 115; bits-to-bytes step on slide 26).\n\nWords = total bytes / bytes per word = 65536 / 4 = 16384 words.\n\nAnswer: the SRAM holds 16384 words (= 16 K words = 2^14 words).", "rubric": "1 mark: 64 KB expanded to 65536 bytes. 1 mark: divided by 4 to give 16384 words. Accept 16 K or 2^14 as equivalent. Dividing by 8 (bits) or forgetting the KB-to-byte step loses the relevant mark.", "hints": ["64 KB is how many bytes?", "Each 32-bit word is 4 bytes.", "Divide the total bytes by 4.", "65536 / 4 = 16384 words (2^14)."]}, {"part": "(b)(i)", "marks": 3, "command_word": "State", "command_meaning": "Name each addressing mode - a short, direct label, one per instruction, no extended explanation required.", "steps": [{"do": "Identify the last three instructions.", "write": "MOV R3,#0x2000 ; STR R5,[R3] ; LDRB R1,[R3,#2].", "slide": "slide 180 (Addressing modes); slide 178 (LDR/STR/LDRB syntax)"}, {"do": "Classify MOV R3,#0x2000.", "write": "Immediate addressing - the operand 0x2000 is an immediate constant carried in the instruction (# prefix).", "slide": "slide 160 (Immediate Operands, # prefix)"}, {"do": "Classify STR R5,[R3].", "write": "Register-indirect addressing - R3 holds the address; no offset.", "slide": "slide 180 (Register Indirect Addressing); slide 179 (STR r0,[r1] = mem32[r1]=r0)"}, {"do": "Classify LDRB R1,[R3,#2].", "write": "Base-plus-offset, pre-indexed (immediate offset) addressing - effective address = R3 + 2, base R3 unchanged (no '!').", "slide": "slide 180 (Base plus Offset Addressing - pre-indexed); slide 181 (Figure 42 Pre-Indexed)"}], "model_answer": "Taking the last three instructions in order (slide 180 lists the course's addressing-mode names):\n\n1. MOV R3,#0x2000   -> Immediate addressing. The second operand is an immediate constant (#0x2000) encoded in the instruction (slide 160).\n2. STR R5,[R3]      -> Register-indirect addressing. R3 supplies the memory address directly, with no offset: mem32[R3] = R5 (slides 179-180).\n3. LDRB R1,[R3,#2]  -> Base-plus-offset, pre-indexed addressing with an immediate offset. The effective address is R3 + 2; R3 itself is not written back (no '!'), so it is pre-indexed (slides 180-181).", "rubric": "1 mark each: MOV = immediate; STR = register-indirect; LDRB = base-plus-offset / pre-indexed (immediate offset). Accept 'register indirect' or 'indirect' for STR. For LDRB accept 'pre-indexed' or 'base + offset'; do NOT accept 'post-indexed' (there is no '!' and the offset is inside the brackets).", "hints": ["Look at how each instruction names its operand: a #constant, a [register], or a [register, #offset].", "#0x2000 is a literal baked into the instruction - what mode is that?", "[R3] with nothing else is the plainest form: the register holds the address itself.", "[R3,#2] adds an immediate offset to a base register, with no write-back: base-plus-offset, pre-indexed."]}, {"part": "(b)(ii)", "marks": 2, "command_word": "Determine", "command_meaning": "Work out the exact value left in R1 (give it as a 32-bit hex value) for a little-endian processor.", "steps": [{"do": "Resolve what STR wrote and where.", "write": "LDR R5,=0x12345678 is the assembler's load-constant pseudo-instruction (used because a bare MOV immediate is limited to the 8-bit-rotated constants of slide 204), so R5=0x12345678; MOV R3,#0x2000 sets R3=0x2000; STR R5,[R3] writes mem32[0x2000] = 0x12345678.", "slide": "slide 179 (STR = mem32[base]); slide 204 (Constraints on the Immediate Operand - why LDR =const is needed)"}, {"do": "Lay out the four stored bytes in little-endian order.", "write": "0x2000=0x78, 0x2001=0x56, 0x2002=0x34, 0x2003=0x12 (LSB at lowest address).", "slide": "slide 184 (little-endian byte order)"}, {"do": "Apply LDRB at offset +2 and zero-extend.", "write": "LDRB R1,[R3,#2] reads the single byte at 0x2002 = 0x34. LDRB loads one UNSIGNED byte: slide 178 lists LDRB alongside the separately named signed loads LDRSB/LDRSH, so LDRB is the zero-extending form - the byte occupies bits[7:0] and the top 24 bits are cleared.", "slide": "slide 178 (LDRB vs the signed LDRSB/LDRSH); slide 180 (base+offset)"}, {"do": "State R1.", "write": "R1 = 0x00000034.", "slide": "slide 178"}], "model_answer": "STR R5,[R3] stores the word 0x12345678 at address 0x2000 (slide 179). In LITTLE-endian the least-significant byte sits at the lowest address (slide 184):\n\n  0x2000 : 0x78   (LSB)\n  0x2001 : 0x56\n  0x2002 : 0x34\n  0x2003 : 0x12   (MSB)\n\nLDRB R1,[R3,#2] loads the one byte at 0x2000 + 2 = 0x2002, which is 0x34. LDRB loads one unsigned byte: slide 178 lists LDRB alongside the separately named signed loads LDRSB/LDRSH, so LDRB is the unsigned (zero-extending) form - the loaded byte sits in bits[7:0] and the top 24 bits are cleared.\n\nAnswer: R1 = 0x00000034.", "rubric": "1 mark: correct little-endian byte map placing 0x34 at 0x2002 (byte at offset +2 identified). 1 mark: R1 = 0x00000034 with zero-extension shown. Writing R1 = 0x34 is acceptable; writing a full word or non-zero upper bits loses the second mark.", "hints": ["First work out what STR put in memory at 0x2000 and how the four bytes are ordered in little-endian.", "Little-endian: 0x2000=78, 0x2001=56, 0x2002=34, 0x2003=12.", "LDRB reads ONE byte, at R3+2 = 0x2002.", "That byte is 0x34; LDRB is the unsigned (zero-extending) byte load, so R1 = 0x00000034."]}, {"part": "(b)(iii)", "marks": 2, "command_word": "Determine", "command_meaning": "Work out the exact value left in R1 (as a 32-bit hex value) for a big-endian processor.", "steps": [{"do": "Keep the same stored word, change only the byte order.", "write": "mem32[0x2000] = 0x12345678, but now big-endian. Slide 184 shows little-endian only; big-endian is its mirror, so the MSB sits at the lowest address.", "slide": "slide 184 (endianness convention shown via little-endian; big-endian = mirror, no dedicated big-endian slide)"}, {"do": "Lay out the four stored bytes in big-endian order.", "write": "0x2000=0x12, 0x2001=0x34, 0x2002=0x56, 0x2003=0x78 (MSB at lowest address).", "slide": "slide 184"}, {"do": "Apply LDRB at offset +2 and zero-extend.", "write": "LDRB R1,[R3,#2] reads the byte at 0x2002 = 0x56; as the unsigned byte load (slide 178 contrasts it with the signed LDRSB/LDRSH), it zero-extends into bits[7:0] with the top 24 bits cleared.", "slide": "slide 178 (LDRB vs the signed LDRSB/LDRSH)"}, {"do": "State R1.", "write": "R1 = 0x00000056.", "slide": "slide 178"}], "model_answer": "The same word 0x12345678 is stored at 0x2000, but in BIG-endian the most-significant byte sits at the lowest address. (Slide 184 illustrates only little-endian; big-endian is derived as its mirror - the deck has no dedicated big-endian figure.)\n\n  0x2000 : 0x12   (MSB)\n  0x2001 : 0x34\n  0x2002 : 0x56\n  0x2003 : 0x78   (LSB)\n\nLDRB R1,[R3,#2] loads the one byte at 0x2000 + 2 = 0x2002, which is 0x56. LDRB is the unsigned (zero-extending) byte load - slide 178 names the signed loads LDRSB/LDRSH separately - so the byte sits in bits[7:0] and the top 24 bits are cleared.\n\nAnswer: R1 = 0x00000056.\n\n(Contrast with (ii): same code, same stored word, but the byte picked out changes from 0x34 to 0x56 purely because of endianness.)", "rubric": "1 mark: correct big-endian byte map placing 0x56 at 0x2002. 1 mark: R1 = 0x00000056 with zero-extension. The teaching point - that only the endianness differs between (ii) and (iii) - should be reflected by the two answers differing (0x34 vs 0x56).", "hints": ["Store 0x12345678 at 0x2000 again, but now most-significant byte at the lowest address.", "Big-endian: 0x2000=12, 0x2001=34, 0x2002=56, 0x2003=78.", "LDRB reads the byte at R3+2 = 0x2002.", "That byte is 0x56, zero-extended: R1 = 0x00000056."]}], "overview": "July 2023 Q1 tests the ARM memory model (SU2/SU5) and data-transfer instructions (SU3). Part (a) is a byte-addressable-memory / endianness exercise on a 64 KB SRAM read as 32-bit words; part (b) walks a four-instruction LDR/MOV/STR/LDRB snippet and asks for the addressing modes plus the byte LDRB pulls out under each endianness. Three anchors run through every part: (1) the course's word = 4 bytes, byte-addressable layout (slide 115, Figure 32 ARM Memory Organization; the bits-to-bytes step is shown on slide 26); (2) the endianness convention taught on slide 184 - note slide 184 illustrates LITTLE-endian only (least-significant byte at the lowest address), and the deck has no dedicated big-endian figure, so big-endian is derived as its exact mirror; and (3) the addressing-mode list on slide 180. The marker wants WORKING shown: the multiply-by-4, the per-byte sketches, and the byte picked out of the stored word. On zero-extension, slide 178 does not print the word \"zero-extend\" - it lists LDRB next to the separately named signed loads LDRSB/LDRSH, so LDRB is grounded as the unsigned (zero-extending) form by that contrast rather than by a direct quote. Common slips to avoid: multiplying the word number by 8 instead of 4, writing a 5-byte range (552-556) instead of 4 bytes (552-555), swapping the two endian orders, and forgetting that LDRB clears R1's top 24 bits."}, {"question_id": "Q2", "overview": "ENG301 July 2023 Q2 is a two-part question on the ARM7 programmer's/system model (part a) and the CPU performance equation applied to CPI-by-category (part b). Part (a) is pure recall-and-explain of material in SU2 slides 108-120 (operating modes, CPSR, exceptions, vector table) and must include a CPSR-mode-field diagram. Part (b) is a quantitative use of the CPU performance equation from slide 124 (CPU Time = I x CPI x T): count instructions per category, then multiply each count by its category CPI and sum. The key trap in (b) is that the sequence with MORE instructions (Code#2, 6 instr) actually runs in FEWER cycles (9) than Code#1 (5 instr, 10 cycles), so markers want the cycle arithmetic shown, not an answer guessed from instruction count. Grounding note on part (a)(ii): the course's slides (111, 119, 120) teach the exception mechanism, but they do NOT print the full exception-priority ordering, the actual binary CPSR mode-field encodings, the interrupt-masking detail, or the specific return opcodes. Those are all correct standard ARM (Furber, ARM SoC Architecture) and are flagged in the answer as standard-ARM detail that goes beyond the deck, so the slide references claim only what the slides actually show. Throughout, show working: list the mode table, draw the CPSR field, give the vector addresses, and write every multiplication out.", "parts": [{"part": "(a)(i) Explain the purpose and importance of ARM operating modes. [7]", "marks": 7, "command_word": "Explain", "command_meaning": "Explain = make the idea clear by giving reasons and showing WHY it matters; not just a list of the modes but what they are FOR and what would go wrong without them. Each distinct reasoned point earns a mark, so write in points with a reason attached to each.", "steps": [{"do": "State what an operating mode is and how many ARM has.", "write": "ARM has 7 operating modes: User, FIQ, IRQ, Supervisor (SVC), Abort, Undefined (Undef) and System. A mode is a privileged/unprivileged execution context that fixes which register bank and which privileges are active.", "slide": "slide 111 (Operating modes); slide 112 notes ('7 modes in ARM', lists all 7)"}, {"do": "Give the purpose of each mode (one line each) so the examiner sees you know what each is FOR.", "write": "User = unprivileged, runs normal application code; FIQ = entered on a high-priority (fast) interrupt; IRQ = entered on a normal (low-priority) interrupt; Supervisor = entered on reset and on a SWI (software interrupt) - the OS/privileged entry point; Abort = handles memory-access violations; Undef = handles undefined instructions; System = privileged but shares the User register set.", "slide": "slide 111 (Operating modes - exact one-line purpose of each of the 7 modes)"}, {"do": "Explain the first reason modes matter: privilege separation / protection.", "write": "Modes separate privileged from unprivileged execution. Most code runs in unprivileged User mode and cannot touch protected CPSR fields (mode bits, I/F interrupt masks, T bit). Privileged modes are entered only through controlled events (reset, SWI, interrupt, fault), so User code cannot illegally gain supervisor privileges without the checks being carried out. This protects the system from buggy or malicious user programs.", "slide": "slide 112 (mode bits, I/F masks and T bit are 'protected from change by the user-level program'); slide 114 (user code cannot gain supervisor privileges without appropriate checks)"}, {"do": "Explain the second reason: fast, clean context switching via banked registers.", "write": "Each exception mode has its own BANKED copies of r13 (SP) and r14 (LR) plus a saved status register SPSR; FIQ additionally banks r8-r12, so FIQ's private set is r8-r14 in total (slide 110 note: 'FIQ has private R8 through R14; the other exception modes have private R13 and R14'). So when a mode is entered the handler automatically gets its own private stack pointer and return address and the User registers are left untouched. This lets the processor switch context and return to exactly where it left off, with little or no manual save/restore - which is the whole point of banking.", "slide": "slide 109-110 (37 registers, register banking: private SP/LR + SPSR; slide 110 note: FIQ private r8-r14, other exception modes private r13-r14); slide 111 ('User mode registers are untouched when FIQ mode is entered')"}, {"do": "Explain the third reason: FIQ speed (why FIQ exists as a separate mode).", "write": "Because FIQ's banked set extends down to r8 (its private r8-r14, slide 110), an FIQ handler can use r8-r14 immediately without pushing the User values to a stack first. This 'reduces exception-entry overhead, especially for FIQ' (slide 110 note) and is exactly why FIQ is used for the fastest, highest-priority interrupts.", "slide": "slide 110 notes ('reduces exception-entry overhead, especially for FIQ'; FIQ private r8-r14); slide 118 (FIQ/IRQ interrupt inputs)"}, {"do": "Close with the importance summary.", "write": "Importance: operating modes are the mechanism that gives ARM (i) memory/privilege protection, (ii) a structured exception/interrupt system, and (iii) fast deterministic context switching - the foundations an operating system needs.", "slide": "slide 111, slide 114"}], "model_answer": "An ARM operating mode is the execution context the processor is running in; it fixes the current privilege level and which banked register set and status register are visible. ARM7 has SEVEN modes (slide 111; slide 112 notes confirm '7 modes in ARM'):\n\n  Mode        Purpose\n  --------    -------------------------------------------------\n  User        Unprivileged - normal application code\n  FIQ         Entered on a high-priority (fast) interrupt\n  IRQ         Entered on a normal (low-priority) interrupt\n  Supervisor  Entered on RESET and on a SWI (OS entry point)\n  Abort       Handles memory-access violations\n  Undefined   Handles undefined instructions\n  System      Privileged, but uses the User register set\n\nWHY THEY MATTER (purpose and importance):\n\n1. Privilege separation / protection. Ordinary code runs in unprivileged User mode, where the CPSR mode bits, the I and F interrupt masks and the T bit are protected from change (slide 112). Privileged modes can only be entered through controlled events - reset, a SWI, an interrupt, or a fault - so User code cannot gain supervisor privileges without the appropriate checks being carried out (slide 114). This protects the system from faulty or hostile user programs.\n\n2. Fast, safe context switching through register banking. Every exception mode has its own banked r13 (SP) and r14 (LR) and a saved status register SPSR; FIQ additionally banks r8-r12, so FIQ's private set is r8-r14 while the other exception modes bank only r13-r14 (slide 110 note). When a mode is entered, the handler automatically has a private stack pointer and return address, and the User registers are left untouched (slide 111). The processor can therefore handle an event and resume exactly where it left off, with minimal manual save/restore.\n\n3. FIQ speed. Because FIQ's private set reaches down to r8 (r8-r14, slide 110), an FIQ handler can use those registers immediately without first stacking the User values, which 'reduces exception-entry overhead, especially for FIQ' (slide 110 note). This is why FIQ is reserved for the fastest, highest-priority interrupts.\n\n(Note how points 2 and 3 are consistent, not contradictory: ALL exception modes bank r13/r14; FIQ ALONE additionally banks r8-r12, giving it a private r8-r14 - exactly slide 110's wording.)\n\nImportance in one line: operating modes are what give ARM memory/privilege protection, a structured interrupt/exception system, and fast deterministic context switching - the hardware foundation an operating system relies on.", "rubric": "7 marks, award 1 each (max 7): [1] names/counts the modes correctly (7 modes) OR gives the purpose table; [1] purpose of User + at least SVC correctly stated; [1] purpose of FIQ/IRQ and Abort/Undef correctly stated; [1] privilege-separation/protection reason with the point that User cannot illegally gain privilege; [1] CPSR mode/I/F/T bits protected from user; [1] register banking gives private SP/LR/SPSR so context switch is clean and User registers untouched; [1] FIQ's private r8-r14 giving fast entry / importance summary tying it to OS needs. Cap at 7. A bare list of mode names with no 'purpose/why' earns at most 2.", "hints": ["Think about two separate questions the examiner is really asking: what is each mode FOR, and why does having modes at all matter to the system.", "Count them - there are 7 ARM modes. Write the one-line job of each (which one is reset/SWI? which two are interrupts? which two are faults?).", "The 'importance' marks come from reasons, not names: privilege protection and controlled entry to privileged modes is one; banked registers for clean context switching is another.", "Mention the CPSR: in User mode the mode bits, I/F masks and T bit are protected from change - that IS the protection mechanism (slide 112, slide 114).", "For the last mark, say explicitly that EVERY exception mode banks r13/r14 and has an SPSR, and that FIQ ADDITIONALLY banks r8-r12 (so FIQ's private set is r8-r14) - that extra banking is what makes FIQ the fast interrupt (slide 110 note)."]}, {"part": "(a)(ii) What are exceptions and why are they important? Explain exception priorities and demonstrate exception entry and exit. [8]", "marks": 8, "command_word": "Explain + Demonstrate", "command_meaning": "Explain = define exceptions and give reasons for their importance; Demonstrate = show the actual step-by-step mechanism of entry and exit (the register copies, the mode change, the vector jump, and the return), not just describe it in words. 'Demonstrate' expects the concrete sequence and ideally the vector addresses.", "steps": [{"do": "Define what an exception is and list the kinds this course names.", "write": "An exception is any event that forces the processor to suspend the current program and run a dedicated handler. In ARM these include interrupts, traps and supervisor calls (slide 119). They are raised by resets, memory faults, undefined instructions, SWIs and the IRQ/FIQ interrupt inputs.", "slide": "slide 119 (ARM Exceptions: Interrupts, Traps, Supervisor calls)"}, {"do": "State why they are important.", "write": "Importance: exceptions are how the processor responds to the outside world and to error conditions deterministically - servicing peripherals via IRQ/FIQ (peripherals are memory-mapped and 'attract the processor's attention by making an Interrupt Request' on IRQ or FIQ), trapping illegal instructions and memory violations, and giving user code a controlled gateway (SWI) into privileged OS services. Without them a CPU could only poll and could not recover from faults.", "slide": "slide 118 (memory-mapped peripherals attract attention via IRQ/FIQ); slide 119 (exception types)"}, {"do": "Give the exception priority order (highest to lowest) and say why ordering is needed.", "write": "When several exceptions occur at once the processor must pick one, so ARM fixes a priority order. FIQ outranks IRQ because FIQ is the high-priority (fast) interrupt and IRQ is the low-priority (normal) one - this is the one ranking the slides state explicitly (slide 111). The complete standard-ARM ordering (highest first) is Reset > Data Abort > FIQ > IRQ > Prefetch Abort > Undefined/SWI (lowest); this full chain is standard ARM behaviour (Furber, ARM SoC Architecture) and is NOT printed on the lecture slides, so do not cite a slide for the whole order. Reset is highest because the machine must always start from a known state. Caution: the vector-table order on slide 119 (0x00 Reset, 0x04 Undef, 0x08 SWI, ...) is an ADDRESS order, not the priority order - the two are different.", "slide": "slide 111 (FIQ = high priority, IRQ = low priority - grounds FIQ>IRQ only); see also slide 120 'ARM Exceptions Handling steps' (course's dedicated handling slide; full order is standard ARM beyond the captured slide text)"}, {"do": "Demonstrate ENTRY as the course's general exception-handling sequence.", "write": "ENTRY - slide 119's 'General way of Exception Handling' gives THREE actions (with exc = svc/irq/fiq/abt/und): (1) save current state by copying PC into r14_exc (the banked LR) and CPSR into SPSR_exc; (2) change the processor operating mode to the appropriate exception mode; (3) force the PC to a vector value between 0x00 and 0x1C depending on the exception type - the instruction there usually branches to the handler. Standard ARM adds one more action at the same time (not stated on slide 119): interrupts are masked on entry - the I bit is set, and for Reset and FIQ the F bit is set too - so a handler is not immediately re-interrupted.", "slide": "slide 119 (the three entry actions: save PC->r14_exc & CPSR->SPSR_exc, change to exception mode, force PC to a 0x00-0x1C vector; exc = svc/irq/fiq/abt/und); see also slide 120 (ARM Exceptions Handling steps). I/F masking = standard ARM behaviour, not on slide 119."}, {"do": "Give the vector table so the 'force PC to 0x00-0x1C' step is concrete.", "write": "Vector table (slide 119, Figure 33): 0x00 Reset, 0x04 Undefined, 0x08 SWI, 0x0C Prefetch Abort, 0x10 Data Abort, 0x14 Reserved, 0x18 IRQ, 0x1C FIQ. Slide 119's notes state there is only a single-word address per exception, so only one instruction fits per entry - hence each entry 'almost always contains a branch' to the handler.", "slide": "slide 119 (Figure 33 Vector Table; notes: single word/instruction per vector, so a branch to the handler)"}, {"do": "Demonstrate EXIT (the reverse).", "write": "EXIT reverses entry: copy SPSR_exc back into CPSR (restoring the old mode and re-enabling interrupts) and restore the PC from r14_exc, adjusted for the pipeline offset. One instruction does both; the S suffix / '^' forces CPSR := SPSR as the PC is reloaded. The offset DIFFERS by exception type: SUBS pc, lr, #4 for IRQ/FIQ and Prefetch Abort; SUBS pc, lr, #8 for Data Abort (there lr = faulting_addr + 8, so #8 re-executes the faulting instruction); MOVS pc, lr for SWI/Undefined; or a stacked return LDMFD sp!, {..., pc}^. These exact return opcodes are standard ARM practice, not printed in the deck; the slide support is only the pipeline reason why an offset is needed (r15 = pc+8 vs next instruction = pc+4, slide 255 - cited by analogy, as slide 255 is about branch/BL return, not exception return).", "slide": "slide 119 (entry copies PC->r14_exc and CPSR->SPSR_exc; exit reverses this); slide 255 (pipeline r15 = pc+8 vs pc+4 correction - by analogy, the reason a return offset exists). Return opcodes themselves = standard ARM beyond the deck."}], "model_answer": "WHAT EXCEPTIONS ARE. An exception is any event that makes the processor stop the current program and jump to a dedicated handler. In ARM they include interrupts, traps and supervisor calls (slide 119), arising from reset, memory aborts, undefined instructions, SWIs, and the IRQ/FIQ interrupt inputs.\n\nWHY THEY MATTER. Exceptions are how the processor reacts to the world and to errors in a controlled, deterministic way. Peripherals are memory-mapped and 'attract the processor's attention by making an Interrupt Request' on IRQ or FIQ (slide 118), so I/O is handled by exceptions rather than wasteful polling; aborts trap illegal memory accesses; Undef traps illegal instructions; and SWI gives User code a safe gateway into privileged OS services. Without exceptions the CPU could not service devices promptly or recover from faults.\n\nEXCEPTION PRIORITIES (highest to lowest):\n   Reset  >  Data Abort  >  FIQ  >  IRQ  >  Prefetch Abort  >  Undefined / SWI\nAn order is needed because several exceptions can be pending in the same cycle and only one can be taken first. Of this chain, the slides state explicitly only that FIQ outranks IRQ, because FIQ is the fast, high-priority interrupt and IRQ the normal, low-priority one (slide 111); the complete ordering above is standard ARM behaviour (Furber, ARM SoC Architecture) and is not itself printed on a course slide (slide 120 'ARM Exceptions Handling steps' is the dedicated handling slide). Reset is highest because the machine must always reach a known state. (Do NOT confuse this with the vector-table ADDRESS order on slide 119 - 0x00 Reset, 0x04 Undef, 0x08 SWI, ... - which is address order, not priority order.)\n\nENTRY - slide 119's 'general way of exception handling' lists THREE actions (exc = svc/irq/fiq/abt/und):\n   1. r14_exc  := PC            ; save return address in the banked LR\n      SPSR_exc := CPSR          ; and save the current status\n   2. CPSR mode bits := exc     ; switch to the appropriate exception mode\n   3. PC := vector address      ; a fixed value in 0x00..0x1C by exception type\nThe instruction sitting at that vector is almost always a branch to the real handler. Standard ARM also masks interrupts at the same moment - it sets the I bit (and the F bit for Reset and FIQ) so the handler is not immediately re-interrupted; this masking is correct ARM behaviour but is NOT among slide 119's three listed actions.\n\nVECTOR TABLE (slide 119, Fig 33):\n   0x00  Reset\n   0x04  Undefined instruction\n   0x08  Software interrupt (SWI)\n   0x0C  Prefetch abort\n   0x10  Data abort\n   0x14  (reserved)\n   0x18  IRQ\n   0x1C  FIQ\nOnly one word is reserved per exception (slide 119 notes), so each entry holds a single branch to the handler.\n\nEXIT - the reverse of entry, done in one instruction whose S/^ forces CPSR := SPSR as the PC is reloaded:\n   CPSR := SPSR_exc             ; restore mode and re-enable interrupts\n   PC   := r14_exc (adjusted)   ; restore the return address\nThe adjustment depends on the exception type, because the pipeline left lr pointing past the intended return point:\n   SUBS pc, lr, #4             ; IRQ / FIQ / prefetch-abort return\n   SUBS pc, lr, #8             ; DATA-ABORT return (lr = faulting_addr + 8, so #8 re-executes the faulting instruction)\n   MOVS pc, lr                ; SWI / undefined-instruction return\n   LDMFD sp!, {r0-r3, pc}^     ; stacked return, ^ restores CPSR too\nThe reason an offset is needed at all is the pipeline fact that r15 = pc + 8 while the next instruction is at pc + 4 (slide 255, cited by analogy - that slide is about branch/BL return, the same pipeline principle). The specific return opcodes above are standard ARM practice and are not printed in the deck.", "rubric": "8 marks (max 8): [1] defines an exception (suspend current program, run handler); [1] names the kinds - interrupts/traps/supervisor calls - and/or sources; [1] importance: I/O via IRQ/FIQ instead of polling / fault recovery / SWI gateway; [1] correct priority order with Reset highest and FIQ above IRQ; [1] entry: copy PC -> r14_exc; [1] entry: copy CPSR -> SPSR_exc AND change mode (and force PC to vector); [1] gives vector addresses (0x00-0x1C) or at least that PC is forced to a type-specific vector holding a branch; [1] exit: restore CPSR from SPSR and PC from r14_exc in one S/^ instruction, with a correct return form (SUBS pc,lr,#4 for IRQ/FIQ, SUBS pc,lr,#8 for data abort, or MOVS pc,lr). Cap 8. Describing entry without the two register copies loses the two 'demonstrate' marks. A data-abort return written as #4 instead of #8 is not penalised on its own but the correct #8 is credit-worthy.", "hints": ["Start with a one-sentence definition (stop current program, run a handler) and the three kinds the course lists on slide 119: interrupts, traps, supervisor calls.", "For importance, connect to I/O: slide 118 says peripherals attract attention by raising IRQ/FIQ - that is why exceptions beat polling. Add fault recovery and the SWI OS gateway.", "Priorities: write them as a single ordered chain. Reset must be top; FIQ must be above IRQ (fast vs normal - the one ranking slide 111 actually states). The full order Reset > Data Abort > FIQ > IRQ > Prefetch Abort > Undef/SWI is standard ARM - say so rather than crediting it to a slide, and don't confuse it with the vector ADDRESS order.", "'Demonstrate entry' means write slide 119's three actions as assignments: (r14_exc := PC, SPSR_exc := CPSR), change mode, PC := vector. You can add that ARM also masks I (and F for reset/FIQ) on entry - just note that bit is standard ARM, not on slide 119.", "Give the vector table (0x00 Reset ... 0x1C FIQ) and do exit as the exact reverse in ONE instruction. Watch the offset: SUBS pc, lr, #4 for IRQ/FIQ/prefetch-abort but SUBS pc, lr, #8 for a DATA ABORT (and MOVS pc, lr for SWI/undef); the S restores CPSR from SPSR and the offset fixes the pipeline (r15 = pc+8 vs pc+4, slide 255)."]}, {"part": "(a)(iii) Sketch a diagram and explain how to identify the current ARM operating mode. [3]", "marks": 3, "command_word": "Sketch + Explain", "command_meaning": "Sketch = draw a labelled diagram (here the CPSR format, specifically the mode field); Explain = say how you READ the current mode from it. Three marks means: a correct diagram, identification of the mode field, and the decoding (bit pattern -> mode).", "steps": [{"do": "Sketch the CPSR showing the condition flags at the top and the control/mode bits at the bottom.", "write": "Draw the 32-bit CPSR with N Z C V (bits 31-28) at the top end and the control byte I F T M4..M0 (bits 7-0) at the low end, and point to M[4:0] as the mode field.", "slide": "slide 112 (Fig 31 CPSR Format; 'bits at the bottom control the processor mode, T, I, F'); slide 113 (NZCV condition flags in the top four bits)"}, {"do": "Explain which field names the mode.", "write": "The current mode is held in the lowest 5 bits M[4:0] of the CPSR. Reading those 5 bits tells you the mode. (5 bits are needed, not 4, because there are 7 modes - more than 4 bits could encode; this is exactly the slide 112 note '5 bits enough? 7 modes in ARM'.)", "slide": "slide 112 (mode bits at the bottom; notes: '5 bits enough? 7 modes in ARM')"}, {"do": "Give the decode so 'identify' is concrete.", "write": "Decode M[4:0]: 10000 User, 10001 FIQ, 10010 IRQ, 10011 Supervisor, 10111 Abort, 11011 Undefined, 11111 System. (These specific binary values are the standard ARM mode-field encodings; the slides give the 7 mode NAMES and that 5 bits select them, but do not print the actual bit patterns, so no slide is claimed for the exact binary values themselves.)", "slide": "slide 111 + slide 112 (support only that 5 mode bits select the 7 named modes; the binary encodings are standard ARM, not printed on these slides)"}], "model_answer": "DIAGRAM - the CPSR format (slide 112/113, Figure 31):\n\n   bit: 31 30 29 28 ........... 7  6  5  4  3  2  1  0\n       +--+--+--+--+--   --+--+--+--+--------------+\n       | N| Z| C| V| ...    | I| F| T|   M4 M3 M2 M1 M0 |\n       +--+--+--+--+--   --+--+--+--+--------------+\n        \\___________/              \\__/ \\______________/\n        condition flags          T bit   MODE field M[4:0]\n        (slide 113)                       (slide 112)\n\nHOW TO IDENTIFY THE MODE: read the lowest five bits of the CPSR, the mode field M[4:0]. Those 5 bits name the current operating mode (5 bits are used, not 4, precisely because ARM has 7 modes - the slide 112 note '5 bits enough? 7 modes in ARM'). Decode them as:\n\n   10000 = User        10011 = Supervisor     11011 = Undefined\n   10001 = FIQ         10111 = Abort          11111 = System\n   10010 = IRQ\n\n(These binary values are the standard ARM mode-field encodings; the slides establish the 7 mode names and that 5 bits select them, but do not print the bit patterns themselves.) So, e.g., if CPSR[4:0] = 10010 the processor is in IRQ mode. (The T bit just above tells you ARM vs Thumb state, and I/F tell you whether IRQ/FIQ are masked - but the MODE itself is M[4:0].)", "rubric": "3 marks: [1] a correct CPSR sketch showing NZCV at the top and the control/mode bits at the bottom (not just a plain box); [1] correctly identifies the mode field as the lowest 5 bits M[4:0] of the CPSR; [1] states you read/decode those bits to get the mode (bonus-safe: gives at least a couple of correct encodings, e.g. 10000 User / 10011 SVC). Cap 3. A diagram with no mode field, or naming CPSR without pointing to M[4:0], loses marks.", "hints": ["The register to draw is the CPSR - that is where the mode lives (slide 112, Figure 31).", "Put the four condition flags N Z C V at the top (bits 31-28, slide 113) and the control bits at the bottom; the mode is in the very lowest bits.", "Label the bottom 5 bits as the mode field M[4:0] - and note the slide 112 point that 5 bits are needed because there are 7 modes, too many for 4 bits.", "To 'identify' the mode you read M[4:0] and decode it; give at least User=10000 and Supervisor=10011 so the marker sees you can decode it (the slides list the mode names; the exact bit patterns are standard ARM)."]}, {"part": "(b)(i) Compute the number of instructions executed in each sequence. [3]", "marks": 3, "command_word": "Compute", "command_meaning": "Compute = work out a numerical answer showing the arithmetic. Here, the instruction count I in each code is simply the sum of the instructions across the three categories.", "steps": [{"do": "Recall that total instructions I = sum of the per-category instruction counts (this is the I in the CPU performance equation).", "write": "From the CPU performance equation CPU Time = I x CPI x T, I is the total instruction count = DP count + Branch count + Memory count.", "slide": "slide 124 (CPU performance equation: CPU Time = I * CPI * T, I = number of instructions in program)"}, {"do": "Add the three counts for Code#1.", "write": "Code#1: I1 = DP + Branch + Mem = 2 + 1 + 2 = 5 instructions.", "slide": "slide 124"}, {"do": "Add the three counts for Code#2.", "write": "Code#2: I2 = DP + Branch + Mem = 4 + 1 + 1 = 6 instructions.", "slide": "slide 124"}], "model_answer": "The number of instructions executed is just the total count across the three categories (the 'I' in CPU Time = I x CPI x T, slide 124).\n\nCode#1: {DP:2, Branch:1, Mem:2}\n   I1 = 2 + 1 + 2 = 5 instructions\n\nCode#2: {DP:4, Branch:1, Mem:1}\n   I2 = 4 + 1 + 1 = 6 instructions\n\nSo Code#1 executes 5 instructions and Code#2 executes 6 instructions.", "rubric": "3 marks: [1] recognises instruction count = sum of the category counts; [1] Code#1 = 5 (2+1+2); [1] Code#2 = 6 (4+1+1). Award the arithmetic marks even if the method mark is implicit. No half marks.", "hints": ["Number of instructions is not the same as number of cycles - here you only need to count instructions.", "Add up the three category counts in each code.", "Code#1: 2 + 1 + 2. Code#2: 4 + 1 + 1. (Answers: 5 and 6.)"]}, {"part": "(b)(ii) Examine which sequence executes faster (compute total cycles). [4]", "marks": 4, "command_word": "Examine", "command_meaning": "Examine = investigate and reach a justified conclusion - here, compute the total cycle count for each sequence using the category CPIs and then state which is faster, with the comparison as justification. Full working expected.", "steps": [{"do": "State the method: total cycles = sum over categories of (count x CPI), from the CPU performance equation.", "write": "Using CPU Time = I x CPI x T with the same clock T for both, the faster code is the one with fewer total cycles. Total cycles = (DP count x 1) + (Branch count x 2) + (Mem count x 3), using the given CPIs DP=1, Branch=2, Mem=3.", "slide": "slide 124 (CPU Time = I * CPI * T; CPI = average cycles per instruction, T = clock cycle time)"}, {"do": "Compute Code#1 total cycles.", "write": "Code#1: (2 x 1) + (1 x 2) + (2 x 3) = 2 + 2 + 6 = 10 cycles.", "slide": "slide 124"}, {"do": "Compute Code#2 total cycles.", "write": "Code#2: (4 x 1) + (1 x 2) + (1 x 3) = 4 + 2 + 3 = 9 cycles.", "slide": "slide 124"}, {"do": "Compare and conclude, highlighting the counter-intuitive point.", "write": "9 < 10, so Code#2 is faster (assuming equal clock period T and no concurrency). Note the lesson: Code#2 runs MORE instructions (6 vs 5) yet takes FEWER cycles, because it trades expensive 3-cycle memory accesses for cheap 1-cycle data-processing instructions - fewer instructions does not mean faster.", "slide": "slide 124 (CPU time depends on I AND CPI, not instruction count alone)"}], "model_answer": "Same clock period T for both and no concurrency, so (from CPU Time = I x CPI x T, slide 124) the faster sequence is the one needing fewer total cycles. With the given category CPIs DP=1, Branch=2, Mem=3:\n\n   Total cycles = (DP x 1) + (Branch x 2) + (Mem x 3)\n\nCode#1  {DP:2, Branch:1, Mem:2}:\n   = (2 x 1) + (1 x 2) + (2 x 3)\n   = 2 + 2 + 6\n   = 10 cycles\n\nCode#2  {DP:4, Branch:1, Mem:1}:\n   = (4 x 1) + (1 x 2) + (1 x 3)\n   = 4 + 2 + 3\n   = 9 cycles\n\nComparison: 9 cycles < 10 cycles, so CODE#2 EXECUTES FASTER.\n\nThe point to notice: Code#2 has MORE instructions (6 vs 5 from part (i)) but FEWER cycles, because it replaces two costly 3-cycle memory accesses with cheap 1-cycle data-processing instructions. This is exactly why CPU time depends on I AND CPI together (slide 124) - raw instruction count alone does not tell you which is faster.", "rubric": "4 marks: [1] correct method - total cycles = sum of (count x category CPI), same T; [1] Code#1 = 10 cycles with working (2+2+6); [1] Code#2 = 9 cycles with working (4+2+3); [1] correct conclusion 'Code#2 is faster' justified by 9<10 (bonus-worthy: notes more instructions yet fewer cycles). Wrong conclusion with correct cycles still earns the two arithmetic marks but loses the method/conclusion mark.", "hints": ["Faster = fewer total clock cycles (same clock speed), not fewer instructions - so you must weight each category by its CPI.", "Total cycles = DP_count x 1 + Branch_count x 2 + Mem_count x 3.", "Code#1: 2(1) + 1(2) + 2(3) = 10. Code#2: 4(1) + 1(2) + 1(3) = 9.", "9 is less than 10, so Code#2 wins - and say WHY: it swapped slow 3-cycle memory ops for fast 1-cycle data ops, so even with one more instruction it needs fewer cycles."]}]}, {"question_id": "Q3", "overview": "Q3 is a Study-Unit-4 pipeline question in two halves. Part (a) is bookwork: explain what a pipeline is and weigh its pros/cons, then name real ARM cores for the 3- and 5-stage designs. Part (b) is the applied core: a short code fragment with a conditional branch (BGE) that depends on the flags of the immediately preceding SUBS. You must (i) draw the overlapped 5-stage execution chart, (ii) pin down the exact clock cycle the branch is resolved and name the resulting control hazard, and (iii) reason about which instruction is really executed after the branch and identify BOTH hazards present: a control hazard (wrong-path fetches that get flushed) and a data hazard on the condition codes (BGE needs the NZCV that SUBS produces). Markers want WORKING and a chart, not just a one-word answer. Ground everything in how ENG301 teaches it: the generic pipeline model (slide 235), the 5-stage ARM organization (slide 259), and the three hazard types with their solutions (slides 267-281). Key correct facts: 3-stage = ARM7 family (ARM7TDMI); 5-stage = ARM9 family (ARM9TDMI); BGE resolves in EX = clock cycle 4; exactly two sequential instructions (ADD, AND) are in the branch shadow and are flushed if the branch is taken (a 2-cycle penalty — note slide 280's generic figure quotes three because it resolves the branch one stage later, whereas slide 279's note confirms it is the Fetch+Decode-stage instructions, two here, that are wrong-path); and the SUBS->BGE flag dependency is the conditional-branch data hazard that slide 281 explicitly warns about, fixed by forwarding/stall/scheduling.", "parts": [{"part": "(a)(i)", "marks": 5, "command_word": "Explain ... and appraise", "command_meaning": "\"Explain\" = make the idea clear by setting out what a pipeline is and HOW it works, with reasons and a diagram. \"Appraise\" = form a judgement by weighing the benefits against the costs, i.e. give balanced advantages AND disadvantages, not just a description.", "steps": [{"do": "Define pipelining as splitting instruction execution into independent single-cycle stages, each with its own hardware, so successive instructions overlap in time.", "write": "\"Pipelining breaks the execution of one instruction into several sub-operations (stages), each done by separate hardware in one clock cycle. While one instruction is in a later stage, the next instruction uses the earlier stage — the stages run in parallel on different instructions, like an assembly / laundry production line.\"", "slide": "slide 233 (Why Pipeline? laundry example, 'idle hardware put to use'); slide 235 (generic pipelined instruction execution)"}, {"do": "Name the stages used in this course and draw a small overlap chart to make the overlap concrete.", "write": "ARM7 3-stage = Fetch, Decode, Execute (slide 244). Generic model = fetch, dec, reg, ALU, mem, res (slide 235). Then draw the diagonal chart (see model answer) showing one instruction completing per cycle once full. Make the header row long enough that EVERY filled stage cell sits under a labelled clock column.", "slide": "slide 244 (3-stage: Fetch/Decode/Execute); slide 235 (generic 6-step model)"}, {"do": "State the performance result that the chart demonstrates: latency vs throughput.", "write": "\"Latency (time for one instruction) is unchanged at N cycles, but once the pipeline is full the THROUGHPUT is one instruction completed every clock cycle.\" For ARM: latency 3 cycles, throughput 1 instr/cycle.", "slide": "slide 246 (Latency vs Throughput: LATENCY=3, THROUGHPUT=1 instr/cycle); slide 245"}, {"do": "Appraise: list at least two advantages.", "write": "Advantages: (1) higher throughput / more instructions per cycle by reusing otherwise-idle hardware; (2) better hardware utilisation (every unit busy each cycle); (3) ~N-fold speedup ideally without lengthening the cycle; (4) breaking work into smaller stages (5-stage) allows a higher clock frequency.", "slide": "slide 233 (idle hardware -> parallel processing); slide 258 (shorter stages -> higher clock)"}, {"do": "Appraise: list at least two disadvantages to balance the judgement.", "write": "Disadvantages: (1) single-instruction latency is NOT reduced; (2) pipeline hazards — structural, data, control — force stalls/bubbles; (3) a taken branch must flush & refill the pipeline, wasting cycles; (4) extra hardware complexity (pipeline latches, forwarding/stall logic); (5) diminishing returns beyond a few stages.", "slide": "slide 267 (three hazard types); slide 279 & 255 (branch flush/refill); slide 236 (law of diminishing returns)"}], "model_answer": "DEFINITION. Pipelining divides the execution of each instruction into a fixed set of sub-operations called stages. Each stage is carried out by its own hardware in one clock cycle, so while one instruction is being executed, the next instruction can be decoded and a third fetched at the same time. It is the processor equivalent of an assembly / laundry production line: idle hardware is put to work on later instructions instead of standing still (slide 233). In the ARM7 3-stage pipeline the stages are Fetch, Decode, Execute (slide 244); the generic course model has fetch, dec, reg, ALU, mem, res (slide 235).\n\nOVERLAP CHART (3-stage, F=Fetch D=Decode E=Execute):\n\n               CC1   CC2   CC3   CC4   CC5   CC6\n  I1  (ADD)     F     D     E\n  I2  (SUB)           F     D     E\n  I3  (AND)                 F     D     E\n  I4  (ORR)                       F     D     E\n\nEach instruction's Fetch is one cycle to the right of the one above it. From CC3 onwards one instruction completes (reaches Execute) every clock cycle: I1 at CC3, I2 at CC4, I3 at CC5, I4 at CC6.\n\nPERFORMANCE (slide 246). Latency = time to finish ONE instruction = 3 cycles (unchanged). Throughput = 1 instruction per clock cycle once the pipeline is full. So an N-instruction program takes about N + (stages-1) cycles instead of N x stages.\n\nAPPRAISAL\nAdvantages:\n  + Higher throughput — reuses hardware that would otherwise be idle, giving up to ~Nx more instructions per unit time for an N-stage pipeline (slide 233).\n  + Better hardware utilisation — every functional unit is kept busy each cycle.\n  + No lengthening of the clock cycle; splitting work into smaller stages (5-stage) even allows a HIGHER clock frequency (slide 258).\nDisadvantages:\n  - Latency of a single instruction is NOT reduced — it still takes all N stages (slide 246).\n  - Hazards appear: structural (resource clash), data (result not ready), control (branch) — each causes stalls/bubbles (slide 267).\n  - A taken branch must flush and refill the pipeline, wasting cycles (slides 279, 255).\n  - Extra hardware cost and complexity: pipeline latches plus forwarding and stall logic.\n  - Diminishing returns — adding more stages (ARM10 6-stage) yields smaller gains (slide 236).\n\nOverall judgement: pipelining is worthwhile because the steady-state throughput gain far outweighs the fixed fill latency and the occasional hazard penalty, which is exactly why every ARM core is pipelined.", "rubric": "5 marks total. [2] Clear explanation that execution is split into overlapping single-cycle stages, WITH a correct overlap diagram or the Fetch/Decode/Execute stage names and the 'one instruction completed per cycle once full' / throughput point. [1.5] At least TWO valid advantages (throughput, hardware utilisation, higher clock). [1.5] At least TWO valid disadvantages (latency unchanged, hazards, branch flush, complexity). Deduct if answer only describes stages with no appraisal (no pros/cons), since the command word 'appraise' requires both sides.", "hints": ["Think of the laundry / assembly-line picture from slide 233 — what are the separate 'machines' doing at the same time?", "A pipeline splits one instruction into stages (Fetch, Decode, Execute for ARM7) that run in parallel on different instructions.", "To 'appraise' you must weigh BOTH sides: draw the overlap chart and give the throughput benefit, then list the costs.", "Advantages come from overlap: higher throughput, idle hardware reused, higher possible clock. Disadvantages: latency per instruction unchanged, and the three hazards plus branch flushing (slides 246, 267, 279).", "Structure it as: (1) definition + stage diagram, (2) latency vs throughput (slide 246), (3) >=2 advantages, (4) >=2 disadvantages, ending with a one-line judgement that throughput gains outweigh the costs."]}, {"part": "(a)(ii)", "marks": 2, "command_word": "Name", "command_meaning": "\"Name\" = simply state the specific item(s) asked for — no explanation required. Give one concrete ARM-family processor for each pipeline depth. Give the actual core name, not just 'an ARM processor'.", "steps": [{"do": "Recall the course mapping of pipeline depth to ARM family.", "write": "ARM7 -> 3-stage, ARM9 -> 5-stage, ARM10 -> 6-stage (slide 236).", "slide": "slide 236 (ARM7 = 3-stage, ARM9 = 5-stage, ARM10 = 6-stage)"}, {"do": "State one named processor for each, preferring the exact cores used in this course.", "write": "3-stage: ARM7 family, e.g. ARM7TDMI (also the Cortex-M3 is a 3-stage core, slide 127). 5-stage: ARM9 family, e.g. ARM9TDMI.", "slide": "slide 236; slide 127 (Cortex-M3 = 3-stage pipeline Harvard core)"}], "model_answer": "3-stage pipeline: ARM7 family — the ARM7TDMI (the ARM core used throughout this course). (The Cortex-M3 is also a 3-stage pipeline core, slide 127.)\n\n5-stage pipeline: ARM9 family — the ARM9TDMI.\n\n(From slide 236: ARM7 = 3-stage, ARM9 = 5-stage, ARM10 = 6-stage.)", "rubric": "2 marks: 1 mark for a correct 3-stage core (ARM7 / ARM7TDMI, or Cortex-M3), 1 mark for a correct 5-stage core (ARM9 / ARM9TDMI). Accept the family name (ARM7, ARM9) or the specific part. No credit for just writing 'ARM' without distinguishing the two, or for naming the wrong depth.", "hints": ["This is straight recall from the 'Pipeline design variation' slide.", "The course keeps using one 3-stage core as its main example — which ARM number is that?", "ARM7 -> 3 stages; ARM9 -> 5 stages; ARM10 -> 6 stages (slide 236).", "Write ARM7TDMI for the 3-stage and ARM9TDMI for the 5-stage."]}, {"part": "(b)(i)", "marks": 5, "command_word": "Fill in (construct)", "command_meaning": "Produce the pipeline execution chart: a grid with instructions down the side and clock cycles across the top, writing the stage (IF, ID, EX, MA, WB) each instruction occupies in each cycle. Each instruction starts one cycle after the one before it (staggered diagonal).", "steps": [{"do": "List the five stages and the five instructions in program order.", "write": "Stages: IF (fetch), ID (decode/read regs), EX (execute/ALU), MA (memory access), WB (write-back) — the course 5-stage model (slide 259). Instructions in sequence: SUBS R0,R1,R2 ; BGE SKIP ; ADD R3,R2,R1 ; AND R4,R5,R6 ; SKIP: SUB R7,R6,R5.", "slide": "slide 259 (5-stage: Fetch, Decode, Execute, Buffer/Data (memory), Write-Back); slide 260 (3- vs 5-stage comparison)"}, {"do": "Stagger each instruction one cycle to the right of the previous one (ideal overlapped fetch, before the branch is resolved).", "write": "SUBS starts IF at CC1; BGE IF at CC2; ADD IF at CC3; AND IF at CC4; SUB IF at CC5. Fill IF,ID,EX,MA,WB diagonally.", "slide": "slide 235 (pipelined overlap); slide 245 (one instruction completed per cycle)"}, {"do": "Note the assumption so the chart is defensible: this is the picture the hardware actually produces because it keeps fetching sequentially until the branch resolves (the flush is dealt with in (iii)).", "write": "\"Assuming sequential fetch (branch not yet resolved), the chart is the standard diagonal. The two shaded instructions after BGE (ADD, AND) are the ones fetched speculatively — their fate is decided in part (iii).\"", "slide": "slide 280 (instructions fetched from the old stream before the branch target is available); slide 279 (fetch of following instruction deferred)"}], "model_answer": "5-stage ARM pipeline — IF=Instruction Fetch, ID=Instruction Decode/read registers, EX=Execute/ALU, MA=Memory Access, WB=Write-Back (slide 259).\n\n  Instruction           CC1  CC2  CC3  CC4  CC5  CC6  CC7  CC8  CC9\n  --------------------------------------------------------------------\n  SUBS R0,R1,R2         IF   ID   EX   MA   WB\n  BGE  SKIP                  IF   ID   EX   MA   WB\n  ADD  R3,R2,R1                   IF   ID   EX   MA   WB\n  AND  R4,R5,R6                        IF   ID   EX   MA   WB\n  SKIP: SUB R7,R6,R5                        IF   ID   EX   MA   WB\n\nEach instruction enters one clock cycle after the previous one, so each column CC3..CC5 shows the pipeline filling, and from CC5 onward one instruction would complete (reach WB) every cycle.\n\nNote: this is the ideal overlapped picture that the processor physically produces while it keeps fetching the next sequential instruction. Because BGE is a conditional branch, the two instructions fetched after it (ADD, AND) are only provisional — see parts (ii) and (iii) for when the branch is resolved and what happens to them.", "rubric": "5 marks. [1] Correct stage labels IF/ID/EX/MA/WB in order. [3] Correct staggered placement — each instruction's IF is one cycle after the previous instruction's IF, and each instruction runs IF->ID->EX->MA->WB on consecutive cycles (e.g. SUBS IF@CC1, BGE IF@CC2, ADD IF@CC3, AND IF@CC4, SUB IF@CC5). [1] Chart neatly shows the overlap / one-per-cycle steady state. Full marks for the clean diagonal chart; do not penalise here for not drawing the flush (that belongs in (iii)) — but a correct note that ADD/AND are speculative earns the benefit of the doubt.", "hints": ["Put the five instructions down the left and clock cycles CC1, CC2, ... across the top.", "The five stages in order are IF, ID, EX, MA, WB (slide 259).", "Each instruction's IF sits exactly one cycle to the right of the instruction above it — a clean diagonal.", "SUBS: IF@CC1. BGE: IF@CC2. ADD: IF@CC3. AND: IF@CC4. SUB: IF@CC5. Then run each one IF->ID->EX->MA->WB on consecutive cycles.", "Draw it exactly as the model answer grid; for part (i) just show the ideal overlap (no flush yet), optionally noting ADD/AND are speculative."]}, {"part": "(b)(ii)", "marks": 3, "command_word": "State and explain", "command_meaning": "Give the specific clock-cycle number the branch result becomes known, then explain WHY that cycle (which stage resolves the branch) and WHAT the pipeline is doing meanwhile — i.e. describe the control hazard that results.", "steps": [{"do": "Identify the stage in which a branch condition/target is resolved in this 5-stage pipeline.", "write": "\"The branch condition is tested and the target address formed in the EX (ALU) stage.\"", "slide": "slide 280 (branch target calculation performed in the ALU/EX stage)"}, {"do": "Read the cycle of BGE's EX stage off the chart from (i).", "write": "From the chart: BGE is IF@CC2, ID@CC3, EX@CC4. Therefore the BGE outcome (taken/not-taken and the target) is known at the end of clock cycle 4 (CC4).", "slide": "slide 259 (EX = Execute stage); chart from (b)(i)"}, {"do": "Explain the control hazard: what was fetched in the meantime, and reconcile the count with slide 280.", "write": "\"While BGE was being fetched and decoded (CC2-CC4) the processor had already fetched the next two SEQUENTIAL instructions — ADD (IF@CC3) and AND (IF@CC4) — before it knew whether the branch is taken: a CONTROL (branch) hazard. These two are exactly the instructions sitting in the Decode and Fetch stages when BGE resolves (slide 279 note). Slide 280's generic figure quotes THREE wrong-path fetches only because its own diagram resolves the branch one stage later; for THIS IF/ID/EX/MA/WB pipeline, resolving in EX at CC4 leaves exactly two.\"", "slide": "slide 279 (control hazard: fetch of following instruction deferred; note: Fetch+Decode-stage instructions are the wrong-path ones); slide 280 (fetch from old stream before target available)"}], "model_answer": "The branch BGE is resolved in its EXECUTE (EX) stage — the stage where the ALU tests the condition (N == V for BGE) and forms the target address (slide 280). From the chart in (b)(i), BGE occupies IF at CC2, ID at CC3 and EX at CC4.\n\n=> The BGE outcome is known at the end of clock cycle 4 (CC4).\n\nWhy this causes a control hazard: the pipeline cannot wait — it keeps fetching the next sequential instructions on the assumption that execution falls through. So by the end of CC4 it has already fetched TWO instructions that follow BGE in memory:\n  - ADD R3,R2,R1  (IF@CC3, now in ID at CC4)\n  - AND R4,R5,R6  (IF@CC4)\nThese were fetched BEFORE the branch was resolved. This is a control (branch) hazard (slide 279): the fetch of the instructions after the branch is affected by the still-unknown branch outcome. If BGE turns out to be TAKEN, these two instructions are on the wrong path and must be discarded (flushed) — see part (iii).\n\nCount check (reconciling slide 280). Slide 280's generic illustration quotes THREE wrong-path fetches because of how that particular figure stages the redirect (its branch resolves one stage later than EX here). For THIS pipeline, with the condition/target resolved in EX at CC4 and the corrected fetch issued the next cycle (CC5), exactly the two instructions fetched in CC3 and CC4 (ADD, AND) lie in the branch shadow — a 2-cycle penalty. This agrees with slide 279's note that, when a branch is taken, it is precisely the instructions in the Fetch and Decode stages (two of them here) that are on the wrong path.", "rubric": "3 marks. [1] Correct cycle: CC4 (the EX stage of BGE). [1] Correct reason: the branch condition/target is resolved in the EX/ALU stage, and BGE is in EX at CC4 (tie it to the chart). [1] Correct explanation of the control hazard: two sequential instructions (ADD, AND) are fetched before CC4 while the outcome is unknown, and would have to be discarded if the branch is taken. Accept 'end of cycle 3 / start of cycle 4' phrasing provided it is tied to the EX stage. Do NOT penalise 'two' as conflicting with slide 280's 'three' — two is correct for EX-stage resolution; the reconciling note is a bonus, not a requirement. No full marks if the student only gives a number with no mention of the EX stage or the control hazard.", "hints": ["A branch is resolved in a particular pipeline stage — which stage computes the ALU result and the target address?", "Find BGE on your chart from (i) and read off the cycle where it is in EX.", "BGE: IF@CC2, ID@CC3, EX@CC4 — so the outcome is known at CC4.", "Now ask: what did the pipeline fetch in CC3 and CC4 while it did not yet know the branch result? Those are the next sequential instructions.", "Answer CC4 (BGE's EX stage); explain that ADD (CC3) and AND (CC4) were already fetched before resolution — that is the control hazard, and they are flushed if the branch is taken. (If you cite slide 280's 'three', note it comes from its own later-resolving figure; EX resolution here gives two.)"]}, {"part": "(b)(iii)", "marks": 10, "command_word": "Identify and explain (analyse)", "command_meaning": "Determine which instruction really runs after the branch, then ANALYSE the fragment for hazards: identify each hazard type present, explain its CAUSE in terms of pipeline timing, and give one or more valid SOLUTIONS for each. Depth and correctness of the hazard analysis carry most of the 10 marks.", "steps": [{"do": "Work out the branch semantics so you can say which instruction executes after BGE, and note where the SKIP label sits in memory.", "write": "\"SUBS R0,R1,R2 computes R1-R2 and sets NZCV. BGE (branch if greater-or-equal, signed) is taken when N==V, i.e. when signed R1 >= R2. In program order the label SKIP sits on the instruction immediately AFTER AND (order: SUBS, BGE, ADD, AND, SKIP:SUB), so BGE merely conditionally skips ADD and AND and both paths reconverge at SUB. If taken (R1 >= R2), control jumps to SKIP: SUB R7,R6,R5 and ADD/AND are NOT executed (flushed). If NOT taken (R1 < R2), ADD executes next, then AND, then SUB.\"", "slide": "slide 190 (BGE = branch if greater or equal, signed); slide 174 (SUBS 'S' sets condition codes)"}, {"do": "Identify Hazard 1 — the control hazard (from part ii) and quantify the penalty.", "write": "\"Control hazard: BGE is resolved only in EX at CC4, but ADD (IF@CC3) and AND (IF@CC4) have already entered the pipeline. If the branch is taken these 2 wrong-path instructions must be flushed and fetching restarts at SKIP in CC5 — a 2-cycle branch penalty. Because SKIP is the next instruction after AND, SUB is the correct next fetch at CC5 whether or not the branch is taken.\" Draw the flushed chart (model answer).", "slide": "slide 279-280 (control hazard, wrong-stream fetches); slide 255 (flush & refill)"}, {"do": "Identify Hazard 2 — the data hazard on the condition codes (the subtle one the course flags explicitly).", "write": "\"Data hazard (RAW on the flags): BGE's outcome depends on the NZCV produced by the immediately-preceding SUBS. SUBS produces its flags in EX (CC3); BGE needs them in EX (CC4). This is a read-after-write dependency on the condition codes — exactly the conditional-branch-on-preceding-result hazard noted in slide 281.\"", "slide": "slide 281 (note: hazards on a conditional branch due to dependency on the condition-code result of the preceding instruction); slide 274 (RAW data hazard)"}, {"do": "Give the cause of each hazard precisely in timing terms.", "write": "Control hazard cause: branch target/condition computed late (EX stage) while fetch continues sequentially. Data hazard cause: the producer (SUBS) has not yet written its flags at the moment the consumer (BGE) needs them — if the branch were resolved early in ID (CC3) the flags (ready only at end of SUBS EX, CC3) would not be available in time.", "slide": "slide 274 (result not available when next instruction collects operands); slide 279 (fetch deferred)"}, {"do": "Give solutions for each hazard.", "write": "Control hazard solutions: (1) compute the branch target/condition earlier (in ID) with dedicated hardware, cutting penalty toward 1 cycle; (2) flush the wrong-path instructions (what ARM does — ARM has NO delayed branch); (3) branch prediction / speculative fetch. Data hazard solutions: (1) forwarding/bypassing the SUBS flag result straight into BGE (no write-back wait); (2) stall BGE until flags are ready; (3) scheduling — insert an independent instruction between SUBS and BGE.", "slide": "slide 281 (compute target early; speculative in 'dec'); slide 277-278 (scheduling / stalling / forwarding for data hazards)"}], "model_answer": "WHICH INSTRUCTION EXECUTES AFTER BGE?\nSUBS R0,R1,R2 computes R1 - R2 and (because of the 'S') sets the flags N,Z,C,V (slide 174). BGE = 'branch if greater than or equal', a SIGNED test that is taken when N == V, i.e. when signed R1 >= R2 (slide 190).\nIn program order the code is SUBS, BGE, ADD, AND, SKIP:SUB — so the label SKIP sits on the instruction immediately AFTER AND. BGE therefore merely conditionally skips exactly ADD and AND, and the taken and not-taken paths reconverge at SUB:\n  - If the branch is TAKEN (R1 >= R2): control transfers to SKIP, so the next instruction actually executed is SKIP: SUB R7,R6,R5. The two sequential instructions ADD R3,R2,R1 and AND R4,R5,R6 are NOT executed — they were only fetched speculatively and are flushed.\n  - If the branch is NOT taken (R1 < R2): execution falls through, so ADD R3,R2,R1 executes next, then AND R4,R5,R6, then SUB R7,R6,R5.\nEither way SUB is reached; because it is the instruction right after AND, its sequential fetch at CC5 is the correct next fetch whether or not the branch is taken. The genuinely interesting (hazardous) case is the taken branch, analysed below.\n\n----------------------------------------------------------------\nHAZARD 1 - CONTROL (BRANCH) HAZARD\nCause: BGE is not resolved until its EX stage (CC4, from part (ii)), but the pipeline keeps fetching sequentially, so ADD (IF@CC3) and AND (IF@CC4) are already in the pipeline before the outcome is known (slides 279-280). If the branch is taken they are on the wrong path. (Slide 280's generic figure quotes three wrong-path fetches because it resolves the branch one stage later; here EX resolution at CC4 leaves exactly the two instructions then in the Decode and Fetch stages — slide 279 note.)\n\nExecution chart when BGE is TAKEN (wrong-path instructions flushed, 'x'):\n\n  Instruction        CC1  CC2  CC3  CC4  CC5  CC6  CC7  CC8\n  ------------------------------------------------------------\n  SUBS R0,R1,R2      IF   ID   EX   MA   WB\n  BGE  SKIP               IF   ID   EX   MA   WB\n  ADD  R3,R2,R1 (kill)         IF   ID    x\n  AND  R4,R5,R6 (kill)              IF    x\n  SKIP: SUB R7,R6,R5                     IF   ID   EX   MA   WB\n\nPenalty: 2 cycles lost (SUB cannot be fetched until CC5, once the target is known).\nSolutions (slide 281):\n  (1) Resolve the branch earlier - compute the condition/target in the ID stage with dedicated hardware, reducing the penalty toward a single cycle.\n  (2) Flush the wrongly-fetched instructions - this is what ARM does; ARM was designed WITHOUT a delayed branch.\n  (3) Branch prediction / speculative fetch of the target.\n\n----------------------------------------------------------------\nHAZARD 2 - DATA HAZARD ON THE CONDITION CODES (Read-After-Write)\nThis is the subtle hazard slide 281 explicitly warns about: that in such a pipeline there may still be hazards on a conditional branch due to dependencies on the condition-code result of the instruction preceding the branch.\nCause: BGE's decision depends on the N,Z,C,V flags written by the IMMEDIATELY preceding SUBS. SUBS produces those flags in its EX stage (end of CC3); BGE consumes them in its EX stage (CC4). It is a read-after-write dependency on the flags (slide 274). In the plain pipeline this is just-in-time (produced CC3, used CC4) and is covered by forwarding; but if solution (1) above moved branch resolution earlier into ID (CC3), BGE would need the flags in CC3 — the very cycle SUBS is still computing them — so it could not get them in time and would stall.\nSolutions (slides 277-278):\n  (1) Forwarding / bypassing - route the flag result straight from SUBS's ALU/EX output into BGE, without waiting for write-back (the automatic hardware fix; programmer does nothing, slide 278).\n  (2) Stall - hold BGE for a cycle until the flags are valid.\n  (3) Scheduling - the compiler/programmer places an independent instruction between SUBS and BGE so the flags are ready by the time BGE needs them.\n\n----------------------------------------------------------------\nSUMMARY: After BGE the instruction actually executed is SKIP: SUB R7,R6,R5 when the branch is taken (with ADD and AND flushed), or ADD R3,R2,R1 when it is not taken; since SKIP labels the instruction right after AND, both paths rejoin at SUB. Two hazards are present: a CONTROL hazard from the branch itself (fix: resolve early / flush / predict) and a DATA hazard from BGE depending on the flags of the preceding SUBS (fix: forward / stall / schedule). There is no structural hazard here because none of these data-processing/branch instructions needs a data-memory access that would clash with instruction fetch.", "rubric": "10 marks. [2] Correct determination of which instruction runs after BGE: SKIP: SUB R7,R6,R5 if taken (ADD, AND flushed), with the taken-condition stated as signed R1>=R2 / N==V; 1 of these 2 marks for stating the not-taken fall-through case too (noting both paths rejoin at SUB is a plus, not required). [3] Control hazard: identified by name, cause explained (branch resolved in EX@CC4 while ADD & AND already fetched), with the flush chart and/or 2-cycle penalty. [2] Data hazard on condition codes identified: BGE depends on the NZCV set by the preceding SUBS (RAW) — this is the slide-281 point and is the discriminating mark; award it for recognising the SUBS->BGE flag dependency. [2] Correct solutions: control -> resolve early in decode / flush (ARM, no delayed branch) / predict; data -> forwarding / stall / scheduling. [1] Quality: coherent analysis, correct cause-in-timing-terms, and noting no structural hazard exists. Partial credit per component. A script that only treats the control hazard and misses the condition-code data hazard caps around 6-7/10.", "hints": ["First decode the logic: SUBS sets the flags, and BGE is a signed 'branch if >='. Under what condition does control go to SKIP, and what happens to ADD and AND then?", "Look at where SKIP sits: it labels the instruction right after AND, so BGE just conditionally skips ADD and AND and both paths rejoin at SUB. If BGE is taken, the next instruction that truly executes is at SKIP; ADD and AND were only fetched speculatively.", "There is more than one hazard here. The obvious one is the branch itself (control hazard from part ii). Look again at what BGE needs as input - where does that value come from?", "BGE's taken/not-taken decision depends on the NZCV flags, and those flags are produced by the SUBS right before it - that is a read-after-write DATA hazard on the condition codes (slide 281 says conditional branches can still hazard on the preceding instruction's result).", "Full answer: (1) after BGE -> SKIP: SUB if taken (flush ADD, AND), else ADD, both paths rejoin at SUB; (2) CONTROL hazard - resolved in EX@CC4, 2 wrong-path fetches flushed, 2-cycle penalty; fix by resolving early in decode / flushing (ARM, no delayed branch) / prediction; (3) DATA hazard - BGE needs SUBS's flags; fix by forwarding / stalling / scheduling; (4) note there is no structural hazard. Show the flushed pipeline chart."]}]}, {"question_id": "Q4", "overview": "Q4 tests the two halves of the ARM syllabus that this course keeps returning to. Part (a) is a \"Design\" task in ARM assembly: it rewards you for using the barrel shifter (LSL/ASR) to do the multiplications and the divide-by-2 instead of MUL, and for showing the intermediate value after every line (slides 159, 170, 171, 160). Part (b) is a memory-interface problem: four byte-wide chips sitting in parallel on D[31:24], D[23:16], D[15:8], D[7:0] form one 32-bit-wide memory, so the TOTAL byte capacity is 4 x (per-chip size). Each bank is 4 x 1 MB = 4 MB. ROM sits at the bottom (0x00000000), SRAM stacks immediately above it, and you report byte address ranges in hex plus a memory-map sketch (slides 26, 115, 118, 119). The single most common error is treating one 1 MB chip as the whole bank (giving 1 MB) instead of multiplying by the four parallel chips (giving 4 MB).", "parts": [{"part": "(a)", "marks": 10, "command_word": "Design", "command_meaning": "Bloom 'Create' level. You must synthesise a working, correct ARM assembly routine from scratch that computes the given expression into the specified registers. The question explicitly adds two sub-demands you are marked on: (1) comment EVERY line with the operation and the intermediate result it leaves behind, and (2) honour the register map R0=X, R1=Y, R2=Z, R3=W, using other registers only as temporaries. 'Design' here means show engineering judgement too - this course teaches the barrel shifter, so a full-marks answer uses shifts for the x4, x8, x6 and /2 rather than MUL/MLA or repeated addition.", "steps": [{"do": "Read the command word and do the algebra on paper first. Note W = (4X + 8Y - 6Z + 64) / 2. Decide the strategy: every coefficient is a small integer, so use the barrel shifter (x4 = LSL #2, x8 = LSL #3) and do the /2 as a single shift right at the very end, after the whole numerator is built. Do NOT divide each term - integer /2 only distributes cleanly if you keep it to the end.", "write": "Planning note: 4X=X<<2, 8Y=Y<<3, 6Z=(3Z)<<1 where 3Z = Z + (Z<<1); +64 is an immediate (#64 = 0x40 is a legal 8-bit ARM immediate); final /2 = ASR #1 (signed) applied to the finished numerator.", "slide": "slide 170 (Shift Register Operands: ADD R3,R2,R1,LSL #3 means R3 = R2 + 8*R1 - the course's own worked multiply-by-shift)"}, {"do": "Form the first term 4X in a temporary, moving X left by 2 bits. Use a temporary (R4) so R0=X is preserved.", "write": "MOV R4, R0, LSL #2        ; R4 = X*4         (4X)", "slide": "slide 171 (LSL: logical shift left by 0-31 places, zero-fill) and slide 167 (MOV)"}, {"do": "Add the second term 8Y, again using the barrel shifter on the fly inside the ADD so it costs only one instruction (slide 170's single shift + ALU op in one cycle).", "write": "ADD R4, R4, R1, LSL #3    ; R4 = 4X + 8Y     (add Y*8)", "slide": "slide 170 (shift and ALU operation combined in one instruction) and slide 159 (ADD)"}, {"do": "Build 6Z, then subtract it. 6 is not a power of two, so make 3Z = Z + 2Z with one ADD, then subtract 3Z shifted left once (=6Z) using a shifted-operand SUB - two instructions total, no MUL needed.", "write": "ADD R5, R2, R2, LSL #1    ; R5 = Z + 2Z = 3Z\nSUB R4, R4, R5, LSL #1    ; R4 = 4X+8Y - (3Z<<1) = 4X+8Y-6Z", "slide": "slide 159 (SUB: R0 = R1 - R2) and slide 170 (shifted register operand feeding the ALU)"}, {"do": "Add the constant 64 as an immediate operand (the # prefix). This completes the numerator.", "write": "ADD R4, R4, #64           ; R4 = 4X + 8Y - 6Z + 64  (full numerator)", "slide": "slide 160 (Immediate Operands: ADD r3,r3,#3; constant preceded by #)"}, {"do": "Divide the finished numerator by 2 with a single arithmetic shift right into the destination R3=W. Use ASR (not LSR) so the sign bit is preserved for negative results; note LSR #1 would be used instead if X,Y,Z are known unsigned. The numerator is a sum of even terms (4X, 8Y, 6Z, 64), so it is always even - the /2 is exact and there is no rounding ambiguity either way.", "write": "MOV R3, R4, ASR #1        ; R3 = W = numerator / 2   (result in W)", "slide": "slide 171 (ASR: arithmetic shift right, sign-preserving - the signed divide-by-2), slide 211 (Example: LSR vs ASR - the course's own side-by-side showing ASR keeps the sign bit, LSR fills zero), slide 243 (Examples: Barrel Shifter - 0xBFFFFF97 ASR #1 -> 0xDFFFFFCB, a negative value halved correctly) and slide 65 (signed numbers / two's complement, why ASR not LSR)"}], "model_answer": "Strategy: rewrite W = (4X + 8Y - 6Z + 64)/2 and build the numerator with the barrel shifter (x4, x8, x6) before a single final divide-by-2. Register map kept exactly: R0=X, R1=Y, R2=Z, R3=W; R4,R5 are temporaries.\n\n        AREA  Q4a, CODE, READONLY\n        ENTRY\nstart\n        ; ---- inputs already in R0=X, R1=Y, R2=Z ----\n        MOV R4, R0, LSL #2      ; R4 = X*4            -> 4X\n        ADD R4, R4, R1, LSL #3  ; R4 = 4X + Y*8       -> 4X + 8Y\n        ADD R5, R2, R2, LSL #1  ; R5 = Z + 2Z         -> 3Z\n        SUB R4, R4, R5, LSL #1  ; R4 = (4X+8Y)-(3Z<<1)-> 4X + 8Y - 6Z\n        ADD R4, R4, #64         ; R4 = ... + 64       -> 4X + 8Y - 6Z + 64 (numerator)\n        MOV R3, R4, ASR #1      ; R3 = numerator / 2  -> W   (ASR = signed /2)\n        ; ---- result W is now in R3 ----\n        END\n\nWhy these choices (the 'Design' marks):\n  * x4 and x8 are powers of two, so they are free shifts (LSL #2, LSL #3) folded into MOV/ADD - no MUL instruction and no extra cycles (slide 170).\n  * x6 is made as (Z + 2Z) then <<1; the <<1 is folded into the SUB as a shifted operand, so the whole '-6Z' is just two instructions (slides 159, 170).\n  * The +64 is a valid 8-bit ARM immediate (0x40), so '#64' is legal (slide 160).\n  * The numerator is a sum of even terms (4X, 8Y, 6Z, 64), so it is ALWAYS even; the /2 is therefore exact and there is no truncation/rounding ambiguity. ASR #1 (arithmetic, sign-preserving) gives the correct signed result; LSR #1 would corrupt the sign bit for negative values and is only safe if X,Y,Z are guaranteed unsigned (slides 171, 211, 243, 65). (ASR rounds toward -infinity on odd negatives, but an odd value can never arise here because the numerator is always even.)\n\nWorking / verification with X=1, Y=1, Z=1 (numerator = 4+8-6+64 = 70, so W = 35):\n  MOV R4,R0,LSL#2      R4 = 4\n  ADD R4,R4,R1,LSL#3   R4 = 4 + 8  = 12\n  ADD R5,R2,R2,LSL#1   R5 = 1 + 2  = 3    (3Z)\n  SUB R4,R4,R5,LSL#1   R4 = 12 - 6 = 6    (3Z<<1 = 6)\n  ADD R4,R4,#64        R4 = 6 + 64 = 70   (numerator)\n  MOV R3,R4,ASR#1      R3 = 70 / 2 = 35 = W  (correct)\n\nSecond check X=2,Y=0,Z=3: numerator = 8 + 0 - 18 + 64 = 54, W = 27. Trace: R4=8; +0=8; R5=9; SUB 8-18=-10; +64=54; ASR#1=27. Correct.", "rubric": "10 marks total, awarded by content not by line count:\n- 1 mark: correct register usage - X,Y,Z read from R0,R1,R2 and final W delivered in R3, temporaries only elsewhere.\n- 2 marks: 4X and 8Y formed correctly (1 each) using shifts or equivalent (LSL #2, LSL #3).\n- 2 marks: 6Z formed and subtracted correctly (1 for building 6Z e.g. 3Z then <<1, 1 for the SUB).\n- 1 mark: +64 added correctly as an immediate (#64).\n- 2 marks: divide-by-2 done once on the completed numerator with a shift (ASR #1, or LSR #1 if unsigned stated); -1 if applied per-term or before the numerator is complete.\n- 2 marks: every line commented with operation AND the intermediate result (this is explicitly demanded; lose both if comments are missing or only restate the mnemonic).\nFull marks also need the program to actually compute the expression - a quick numeric trace (as shown) earns the benefit of the doubt. Using MUL instead of shifts is NOT wrong and loses no marks if correct and commented, but a design that ignores the barrel shifter entirely may lose 1 of the design marks in a course that emphasises it.", "hints": ["Do the algebra before you touch a register. Which coefficients are powers of two, and which one (the 6) is not? That tells you which terms are a single shift and which needs two steps.", "You are not meant to reach for MUL. This course's slide on shift-register operands shows that 'ADD Rd, Ra, Rb, LSL #n' computes Ra + (2^n)*Rb in one instruction - that is your multiply.", "Keep X,Y,Z intact by accumulating into a temporary (say R4). 4X = X<<2, 8Y = Y<<3. For 6Z, note 6Z = (3Z)<<1 and 3Z = Z + (Z<<1).", "Build the ENTIRE numerator first (including +64), and only then divide by 2 with ONE shift. Dividing each term separately gives the wrong integer result. The numerator is a sum of even terms so the halving is always exact.", "For the divide use ASR #1 (arithmetic, sign-preserving) because the data may be signed two's complement; LSR #1 is only safe if the inputs are unsigned (compare slide 211 LSR vs ASR). Full solution: MOV R4,R0,LSL #2 / ADD R4,R4,R1,LSL #3 / ADD R5,R2,R2,LSL #1 / SUB R4,R4,R5,LSL #1 / ADD R4,R4,#64
